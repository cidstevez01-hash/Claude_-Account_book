<svg id="pearl-ink-background" viewBox="0 0 390 844" width="390" height="844" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 极弱的水彩纤维边缘自然扩散滤镜 (Turbulence & Displacement) -->
          <filter id="soft-ink-diffusion" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
            <feTurbulence type="fractalNoise" baseFrequency="0.007" numOctaves="4" seed="37" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="32" xChannelSelector="R" yChannelSelector="G" result="feathered" />
            <feGaussianBlur in="feathered" stdDeviation="14" result="blurred" />
          </filter>

          <!-- 重度高斯虚化用于底色柔和过渡 -->
          <filter id="deep-wash-blur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="48" />
          </filter>

          <filter id="medium-wash-blur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="28" />
          </filter>

          <!-- 径向渐变预设 -->
          <!-- 顶部左侧：极淡薰衣草/浅紫晕染 -->
          <radialGradient id="grad-top-lavender" cx="15%" cy="8%" r="55%">
            <stop offset="0%" stop-color="#DAD0EF" stop-opacity="0.38" />
            <stop offset="50%" stop-color="#E9DEF3" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#FFFEFF" stop-opacity="0" />
          </radialGradient>

          <!-- 顶部右侧：微风淡薄荷微光 -->
          <radialGradient id="grad-top-mint" cx="88%" cy="12%" r="48%">
            <stop offset="0%" stop-color="#C8EEE5" stop-opacity="0.32" />
            <stop offset="60%" stop-color="#CBE8F2" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#FFFEFF" stop-opacity="0" />
          </radialGradient>

          <!-- 右中边缘：极淡青色回响，烘托珠光偏振 -->
          <radialGradient id="grad-mid-cyan" cx="96%" cy="46%" r="45%">
            <stop offset="0%" stop-color="#CBE8F2" stop-opacity="0.28" />
            <stop offset="70%" stop-color="#E9DEF3" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#FFFEFF" stop-opacity="0" />
          </radialGradient>

          <!-- 左中偏下：薰衣草水彩水迹 -->
          <radialGradient id="grad-mid-lavender" cx="4%" cy="60%" r="52%">
            <stop offset="0%" stop-color="#DAD0EF" stop-opacity="0.32" />
            <stop offset="65%" stop-color="#E9DEF3" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#FFFEFF" stop-opacity="0" />
          </radialGradient>

          <!-- 底部主体：薄荷绿与柔紫水彩交融沉积 -->
          <radialGradient id="grad-bottom-mint" cx="28%" cy="94%" r="65%">
            <stop offset="0%" stop-color="#C8EEE5" stop-opacity="0.48" />
            <stop offset="55%" stop-color="#CBE8F2" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#FFFEFF" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="grad-bottom-lavender" cx="82%" cy="92%" r="60%">
            <stop offset="0%" stop-color="#DAD0EF" stop-opacity="0.45" />
            <stop offset="45%" stop-color="#E9DEF3" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#FFFEFF" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- 1. 底层：棉浆纸白基准 #FFFEFF -->
        <rect width="390" height="844" fill="#FFFEFF" />

        <!-- 2. 第一层：广域柔焦基底 (保证无硬边、全域通透) -->
        <g filter="url(#deep-wash-blur)" opacity="0.85">
          <!-- 顶端微薰衣草气蕴 -->
          <ellipse cx="60" cy="50" rx="160" ry="120" fill="url(#grad-top-lavender)" />
          <!-- 顶端右侧薄荷晨光 -->
          <ellipse cx="340" cy="90" rx="140" ry="110" fill="url(#grad-top-mint)" />
          <!-- 右缘浅青轻透过渡 -->
          <circle cx="380" cy="390" r="130" fill="url(#grad-mid-cyan)" />
          <!-- 左缘薰衣草水痕 -->
          <ellipse cx="10" cy="510" rx="130" ry="160" fill="url(#grad-mid-lavender)" />
          <!-- 底部沉淀：薄荷绿与香芋紫天然交融 -->
          <path d="M-40,700 Q100,640 220,720 T430,710 L430,890 L-40,890 Z" fill="url(#grad-bottom-mint)" />
          <path d="M120,680 Q260,620 420,690 L420,890 L120,890 Z" fill="url(#grad-bottom-lavender)" />
        </g>

        <!-- 3. 第二层：带有水彩边缘扩散微羽化的不规则水渍形色块 (Ink-wash edge dispersion) -->
        <g filter="url(#soft-ink-diffusion)" opacity="0.65">
          <!-- 左上角水彩笔触自然散开 -->
          <path d="M-20,-10 C50,15 110,10 145,55 C175,95 120,140 75,135 C30,130 -10,80 -20,-10 Z" fill="#DAD0EF" opacity="0.45" />
          
          <!-- 右上角薄荷水斑羽化 -->
          <path d="M260,-20 C300,10 380,5 410,40 C430,70 380,120 340,110 C300,100 240,70 245,20 C248,-5 255,-15 260,-20 Z" fill="#C8EEE5" opacity="0.38" />
          
          <!-- 右侧极淡青色微晕 (增加珠光折射层次) -->
          <path d="M410,320 C370,340 350,385 365,430 C380,470 415,480 430,460 Z" fill="#CBE8F2" opacity="0.35" />

          <!-- 左下侧柔紫水痕延伸 -->
          <path d="M-30,460 C25,480 50,530 40,585 C30,635 -15,660 -40,640 Z" fill="#E9DEF3" opacity="0.4" />

          <!-- 底部左侧薄荷绿墨晕沉积 -->
          <path d="M-30,710 C40,680 130,710 170,760 C210,810 180,870 120,870 C50,870 -20,830 -30,710 Z" fill="#C8EEE5" opacity="0.5" />

          <!-- 底部右侧薰衣草紫墨晕沉积 -->
          <path d="M190,750 C240,690 320,685 370,725 C420,765 410,845 350,870 C290,890 210,860 180,810 Z" fill="#DAD0EF" opacity="0.5" />

          <!-- 底部中央细微青色交界水线 (增强水彩水迹沉淀感) -->
          <path d="M130,810 C180,780 250,770 290,815 C260,855 190,865 140,840 Z" fill="#CBE8F2" opacity="0.3" />
        </g>

        <!-- 4. 第三层：中央 65% 保留纯白通透呼吸区 (纯白柔和擦亮，杜绝卡片可读性受干扰) -->
        <g filter="url(#deep-wash-blur)">
          <ellipse cx="195" cy="420" rx="145" ry="250" fill="#FFFEFF" opacity="0.95" />
        </g>
      </svg>
