<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PigBang 实际页面渐变对比</title><style>body{margin:0;padding:26px 18px 40px;background:#f7f7f7;color:#303030;font:15px/1.65 system-ui,sans-serif}main{max-width:1240px;margin:auto}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:0}p{margin:0;color:#646464}header{margin-bottom:22px}.tabs{display:flex;gap:10px;margin:18px 0 24px}button{font:inherit;background:#fff;border:1px solid #ccc;border-radius:22px;padding:8px 23px;color:#303030;cursor:pointer}button[aria-pressed=true]{background:#303030;color:white;border-color:#303030}.comparison{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}figure{margin:0}figcaption{margin-bottom:12px}figcaption p{font-size:12px;overflow-wrap:anywhere}img{display:block;max-width:390px;width:100%;height:auto;border-radius:24px;box-shadow:0 5px 20px #0000000d}a{display:block}footer{margin-top:20px;color:#646464;font-size:13px}@media(max-width:760px){.comparison{grid-template-columns:1fr;gap:30px}figure{max-width:390px;margin:auto;width:100%}body{padding:22px 12px}}</style><main><header><h1>实际页面 · 渐变背景对比</h1><p>同一套首页与统计页，仅背景变化。雪花为原图抠背景版本。</p><div class="tabs" aria-label="选择页面"><button type="button" data-screen="home" aria-pressed="true">首页</button><button type="button" data-screen="stats" aria-pressed="false">统计</button></div></header><section class="comparison"><figure><figcaption><h2>暖纸白</h2><p>#FFFFFF → #FAF8F4 → #F4EFE6</p></figcaption><a data-full="warm-paper" href="warm-paper-home.png" target="_blank"><img data-page="warm-paper" src="warm-paper-home.png" alt="暖纸白渐变·实际首页" width="390" height="844"></a></figure><figure><figcaption><h2>银灰</h2><p>#FFFFFF → #F6F7F9 → #ECEEF2</p></figcaption><a data-full="silver-gray" href="silver-gray-home.png" target="_blank"><img data-page="silver-gray" src="silver-gray-home.png" alt="银灰渐变·实际首页" width="390" height="844"></a></figure><figure><figcaption><h2>淡香槟</h2><p>#FFFFFF → #FCFAF6 → #F5EFE3</p></figcaption><a data-full="champagne" href="champagne-home.png" target="_blank"><img data-page="champagne" src="champagne-home.png" alt="淡香槟渐变·实际首页" width="390" height="844"></a></figure></section><footer>空账本预览；状态栏与安全区为展示模拟。点击页面可查看原尺寸图片。</footer></main><script>document.querySelectorAll("[data-screen]").forEach(button=>button.onclick=()=>{const page=button.dataset.screen;document.querySelectorAll("[data-screen]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));document.querySelectorAll("[data-page]").forEach(img=>{img.src=img.dataset.page+"-"+page+".png";img.alt=img.dataset.page+"渐变·实际"+(page==="home"?"首页":"统计页");});document.querySelectorAll("[data-full]").forEach(a=>a.href=a.dataset.full+"-"+page+".png");});</script></html>
