<script>
(()=>{const root=document.getElementById('pb-dusk-demo'),phone=root.querySelector('.pb-phone'),readout=root.querySelector('.pb-readout');let state={playing:true,effects:true};function render(){phone.classList.toggle('pb-paused',!state.playing);phone.classList.toggle('pb-no-effects',!state.effects);root.querySelector('.pb-motion').textContent=state.playing?'暂停动效':'播放动效';root.querySelector('.pb-motion').setAttribute('aria-pressed',String(!state.playing));root.querySelector('.pb-effects').textContent=state.effects?'关闭光效对比':'开启光效对比';root.querySelector('.pb-effects').setAttribute('aria-pressed',String(state.effects))}function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{theme:'暮枫',effects:state.effects,playing:state.playing}}).catch(()=>{})}root.querySelector('.pb-motion').onclick=()=>{state.playing=!state.playing;render();save()};root.querySelector('.pb-effects').onclick=()=>{state.effects=!state.effects;render();save()};root.querySelectorAll('.pb-tab').forEach(b=>b.onclick=()=>{root.querySelectorAll('.pb-tab').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));readout.textContent='暮枫 · '+b.textContent.trim()+'选中（仅预览图标状态）'});root.querySelectorAll('.pb-toggle button').forEach(b=>b.onclick=()=>{root.querySelectorAll('.pb-toggle button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));root.querySelector('.pb-donut-label').textContent=b.textContent+'合计'});function ripple(b){const span=document.createElement('span');span.className='pb-ripple';b.appendChild(span);setTimeout(()=>span.remove(),850)}root.querySelector('.pb-fab').onclick=e=>{ripple(e.currentTarget);readout.textContent='记账按钮 · 按压环光预览'};root.querySelector('.pb-round').onclick=e=>ripple(e.currentTarget);const drawer=root.querySelector('.pb-drawer');root.querySelector('[aria-label="打开抽屉"]').onclick=()=>{drawer.classList.add('open');drawer.setAttribute('aria-hidden','false')};root.querySelector('.pb-close').onclick=()=>{drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')};drawer.querySelectorAll('button:not(.pb-close)').forEach(b=>b.onclick=()=>{readout.textContent=b.textContent+' · 仅设计预览';drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')});const saved=window.openai?.widgetState?.modelContent;if(saved?.theme==='暮枫'){state.playing=saved.playing!==false;state.effects=saved.effects!==false}window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s?.theme==='暮枫'){state.playing=s.playing!==false;state.effects=s.effects!==false;render()}});render();if(globalThis.Tweak){const settings={accent:'#ed8ca6',panel:'#382b36'};const tweak=new Tweak({container:phone,onChange:()=>{phone.style.setProperty('--pb-primary',settings.accent);phone.style.setProperty('--pb-panel',settings.panel)}});tweak.addColorPicker(settings,'accent',{label:'暮枫图标主色'});tweak.addColorPicker(settings,'panel',{label:'卡片颜色'})}})();
</script>
