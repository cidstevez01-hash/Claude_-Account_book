<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日历切换按钮 · 样式预览01</title><style>body{margin:0;background:#f6f6f5;color:#383633;font:15px/1.7 system-ui}main{max-width:1250px;margin:auto;padding:28px 24px 36px}h1{font-size:24px;margin:0 0 5px}p{margin:4px 0 16px;color:#68635d}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0}button{cursor:pointer;font:inherit;border:1px solid #c5beb4;background:#fff;color:#524d45;padding:7px 16px;border-radius:22px}button.active{background:#eae3d6;border-color:#9f8a62}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article h2{font-size:18px;margin:0}article p{font-size:13px;min-height:24px}.screen{display:block;width:100%;max-width:390px;border-radius:24px;box-shadow:0 8px 25px #25334314;border:1px solid #e0dcd6;cursor:pointer}.note{font-size:13px;margin-top:22px}.recommend{color:#8b6826;font-size:12px;font-weight:500;margin-left:6px}@media(max-width:850px){.grid{grid-template-columns:1fr}article{max-width:440px;margin:auto;width:100%}main{padding:20px 16px}.screen{max-width:100%}}.zoom{position:relative;overflow:hidden;width:292px;height:140px;max-width:100%;margin:8px auto 18px;border:1px solid #dfd9d0;border-radius:16px;background:white}.zoom-source{position:absolute;width:780px;max-width:none;left:-488px;top:-106px;cursor:pointer}.zoom-label{font-size:12px;text-align:center;color:#756d61;margin:0 0 8px}</style><main><h1>日历右上角 · 三种外观</h1><p>保留现金／积分切换逻辑；只比较按钮外观。其余页面沿用现有设计。</p><div class="tools"><button class="active" data-theme="warm">暖金</button><button data-theme="silver">银灰</button><span style="width:10px"></span><button class="active" data-mode="cash">金额模式</button><button data-mode="point">积分模式</button></div><div class="grid"><article><h2>A · 单图标圆钮<span class="recommend">推荐</span></h2><p>只显示当前模式，保持原来的40px尺寸</p><div class="zoom-label">右上角放大查看 · 2倍</div><div class="zoom"><img class="zoom-source" data-design="A" src="../20261126-01/warm-A-cash.png" alt="单图标圆钮的实际日历页预览的放大图"></div><img class="screen" data-design="A" src="../20261126-01/warm-A-cash.png" alt="单图标圆钮的实际日历页预览"></article><article><h2>B · 双符号拨片</h2><p>¥ 与 P 并排，亮底标出当前模式</p><div class="zoom-label">右上角放大查看 · 2倍</div><div class="zoom"><img class="zoom-source" data-design="B" src="../20261126-01/warm-B-cash.png" alt="双符号拨片的实际日历页预览的放大图"></div><img class="screen" data-design="B" src="../20261126-01/warm-B-cash.png" alt="双符号拨片的实际日历页预览"></article><article><h2>C · 方形徽章</h2><p>简洁符号配细边框与内侧虚线</p><div class="zoom-label">右上角放大查看 · 2倍</div><div class="zoom"><img class="zoom-source" data-design="C" src="../20261126-01/warm-C-cash.png" alt="方形徽章的实际日历页预览的放大图"></div><img class="screen" data-design="C" src="../20261126-01/warm-C-cash.png" alt="方形徽章的实际日历页预览"></article></div><p class="note">基于实际 React 日历页面截图。点击页面图可切换模式；顶部按钮可切换主题。状态栏及安全区为展示模拟，使用隔离空账本，无真实账号写入。此页仅为设计预览，右上角按钮尚未替换进App。</p></main><script>let theme="warm",mode="cash";function render(){document.querySelectorAll(".screen,.zoom-source").forEach(i=>i.src="../20261126-01/"+theme+"-"+i.dataset.design+"-"+mode+".png");document.querySelectorAll("[data-theme]").forEach(b=>b.classList.toggle("active",b.dataset.theme===theme));document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode))}document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{theme=b.dataset.theme;render()});document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelectorAll(".screen,.zoom-source").forEach(i=>i.onclick=()=>{mode=mode==="cash"?"point":"cash";render()});</script></html>
