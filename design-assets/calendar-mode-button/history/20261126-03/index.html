<h1>保留原来的前后交换</h1>
<p class="intro">两个图标始终同时显示。点击后斜向换位，左下图标置前高亮，右上图标退后变淡；仍使用原来的 0.3 秒动画。</p>
<div class="toolbar"><button data-theme="warm" class="active">暖金</button><button data-theme="silver">银灰</button><span class="spacer"></span><button id="play" aria-pressed="true">暂停自动演示</button><button id="swap">手动交换</button><span id="mode-label"></span></div>
<div class="choices">
 <article data-choice="p"><h2>A · 纸币＋P 积分币</h2><p class="caption">简化积分硬币，保留圆钮和原来的叠放关系。</p><div class="large-stage"><div class="large-control"></div></div><p class="hint">点上方按钮试交换 · 放大 3.6 倍</p><div class="phone"><img class="page-image" alt="实际日历页面"><div class="actual-control"></div></div></article>
 <article data-choice="star"><h2>B · 纸币＋星形积分币</h2><p class="caption">将积分标识换成星章，使用同一套换位动态。</p><div class="large-stage"><div class="large-control"></div></div><p class="hint">点上方按钮试交换 · 放大 3.6 倍</p><div class="phone"><img class="page-image" alt="实际日历页面"><div class="actual-control"></div></div></article>
</div>
<p class="footnote">这是样式预览：自动演示仅在此页面播放，App 仍然点按切换。原按钮的两套坐标、尺寸、层级、透明度、灰度与动画时长均保留；日历数据来自实际 React 页面隔离截图，状态栏和安全区为模拟。App 中的切换组件尚未替换。</p>
