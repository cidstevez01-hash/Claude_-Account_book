<div class="max-w-[480px] mx-auto bg-surface min-h-screen relative shadow-2xl flex flex-col">
<!-- Top App Bar (Custom Task-focused) -->

<button class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center hover:bg-surface-variant transition-colors group">

</button>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Record Entry</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 overflow-y-auto hide-scrollbar pb-safe-bottom">

<div class="px-md pt-2 pb-6">
<div class="flex p-1 bg-surface-container-highest rounded-xl border border-outline-variant/30 relative">

<button class="flex-1 py-2 text-center rounded-lg text-primary font-label-caps text-label-caps font-bold z-10 relative">EXPENSE</button>

</div>
</div>

<span class="font-hero-balance text-hero-balance text-primary mr-2 align-baseline">¥</span>
<input class="bg-transparent border-none outline-none font-hero-balance text-hero-balance text-on-surface w-full text-left p-0 focus:ring-0 leading-none" placeholder="0" type="number" value="2450">
</div>
</div>
<!-- Decorative Ledger Line -->
<div class="w-full border-b-[1.5px] border-dashed border-outline-variant"></div>

<span class="text-primary font-tab-label text-tab-label">Edit</span>

</button>

<div class="w-full border-b-[1.5px] border-dashed border-outline-variant"></div>

<div class="px-md py-md pb-[120px]">

<span class="material-symbols-outlined">how_to_reg</span>
                Save Entry

<div class="absolute -top-3 -right-3 w-8 h-8 bg-inverse-primary rotate-45 opacity-20"></div>
</button>
