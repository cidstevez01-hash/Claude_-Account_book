<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.theme-card');
            
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove selected state from all
                    cards.forEach(c => {
                        c.classList.remove('selected', 'border-primary', 'bg-surface-container-highest');
                        c.classList.add('border-outline-variant', 'bg-surface');
                        const indicator = c.querySelector('.rounded-full:last-child');
                        indicator.className = 'w-6 h-6 rounded-full border-2 border-outline-variant bg-transparent flex items-center justify-center';
                        indicator.innerHTML = '';
                        
                        const label = c.querySelector('.font-label-caps');
                        label.classList.remove('text-primary');
                        label.classList.add('text-on-surface-variant');
                    });

                    // Add selected state to clicked
                    card.classList.add('selected', 'border-primary', 'bg-surface-container-highest');
                    card.classList.remove('border-outline-variant', 'bg-surface');
                    
                    const activeIndicator = card.querySelector('.rounded-full:last-child');
                    activeIndicator.className = 'w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_2px_0_var(--tw-colors-primary-container)]';
                    activeIndicator.innerHTML = '<span class="material-symbols-outlined text-[16px] font-bold" data-weight="fill" data-icon="check">check</span>';
                    
                    const activeLabel = card.querySelector('.font-label-caps');
                    activeLabel.classList.add('text-primary');
                    activeLabel.classList.remove('text-on-surface-variant');
                });
            });
        });
    </script>
