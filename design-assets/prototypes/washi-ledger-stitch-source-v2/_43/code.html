<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Washi Ledger - Confirm Delete</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "background": "#fff8f5",
                        "tertiary": "#765700",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdf9e",
                        "on-background": "#231a13",
                        "inverse-surface": "#392e27",
                        "primary-fixed": "#ffdad5",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#410001",
                        "surface-variant": "#f2dfd4",
                        "surface": "#fff8f5",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "surface-container": "#fdeadf",
                        "on-tertiary-fixed": "#261a00",
                        "surface-container-highest": "#f2dfd4",
                        "outline-variant": "#dcc0bc",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#7f2921",
                        "secondary-container": "#c9edba",
                        "surface-container-high": "#f8e5da",
                        "primary-container": "#bb554a",
                        "secondary-fixed-dim": "#add09f",
                        "primary": "#9b3e34",
                        "on-surface": "#231a13",
                        "inverse-on-surface": "#ffede4",
                        "on-tertiary-container": "#fffbff",
                        "on-surface-variant": "#56423f",
                        "on-secondary-container": "#4d6c44",
                        "secondary": "#48663e",
                        "outline": "#89726f",
                        "secondary-fixed": "#c9edba",
                        "surface-container-low": "#fff1ea",
                        "inverse-primary": "#ffb4aa",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fff8f5",
                        "on-secondary-fixed": "#052103",
                        "tertiary-fixed-dim": "#f2bf48",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#314e28",
                        "on-primary-container": "#fffbff",
                        "surface-dim": "#e9d6cc",
                        "surface-tint": "#9f4036",
                        "primary-fixed-dim": "#ffb4aa",
                        "tertiary-container": "#946f00",
                        "on-tertiary-fixed-variant": "#5b4300"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "safe-bottom": "90px",
                        "gutter": "16px",
                        "lg": "24px",
                        "md": "16px",
                        "sm": "12px",
                        "xs": "8px",
                        "base": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Noto Sans SC"],
                        "stat-figure": ["Noto Serif SC"],
                        "body-md": ["Noto Sans SC"],
                        "input-amount": ["Noto Serif SC"],
                        "entry-amount": ["Noto Serif SC"],
                        "label-caps": ["Noto Sans SC"],
                        "headline-lg": ["Noto Serif SC"],
                        "headline-md": ["Noto Serif SC"],
                        "tab-label": ["Noto Sans SC"],
                        "hero-balance": ["Noto Serif SC"]
                    },
                    "fontSize": {
                        "body-lg": ["15px", { "lineHeight": "21px", "fontWeight": "500" }],
                        "stat-figure": ["18px", { "lineHeight": "22px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "input-amount": ["32px", { "lineHeight": "38px", "fontWeight": "600" }],
                        "entry-amount": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "14px", "letterSpacing": "1px", "fontWeight": "500" }],
                        "headline-lg": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],

                }
            }
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-background font-body-md relative overflow-hidden flex items-center justify-center">
<!-- Dimmed Background Overlay (Level 3 Liquid Glass) -->
<div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-[4px] z-40 transition-opacity duration-300"></div>
<!-- Modal Container (Level 1 Ledger Paper) -->
<div class="relative z-50 w-[90%] max-w-[400px] bg-surface rounded-[20px] shadow-[0_4px_24px_rgba(35,26,19,0.15)] flex flex-col items-center p-xl">
<!-- Washi Tape Decoration -->
<div class="absolute -top-3 -right-4 w-12 h-6 bg-tertiary-fixed opacity-70 transform rotate-[15deg] shadow-sm pointer-events-none"></div>
<!-- Icon Indicator -->
<div class="w-16 h-16 rounded-full bg-error-container text-on-error-container flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-headline-lg font-headline-lg" data-icon="delete" data-weight="fill" style="font-variation-settings: 'FILL' 1;">delete</span>
</div>
<!-- Headline -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm text-center">
            确定要删除这条记录吗？
        </h2>
<!-- Subtext -->
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-xl">
            删除后将无法恢复此条账单数据，您的账户余额将自动重新计算。
        </p>
<!-- Separation Line (Ledger style) -->
<div class="w-full border-t-[1.5px] border-dashed border-outline-variant mb-lg relative">
<div class="absolute -top-[1.5px] -left-2 w-4 h-[3px] bg-surface"></div>
<div class="absolute -top-[1.5px] -right-2 w-4 h-[3px] bg-surface"></div>
</div>
<!-- Action Buttons -->
<div class="flex w-full gap-md">
<!-- Cancel Button -->
<button class="flex-1 py-sm px-md rounded-lg border border-outline text-on-surface font-body-lg text-body-lg text-center transition-colors hover:bg-surface-variant/30 active:scale-95">
                取消
            </button>
<!-- Delete Button (Level 2 Stamp) -->
<button class="flex-1 py-sm px-md rounded-lg bg-[#d1665a] text-on-primary font-body-lg text-body-lg text-center shadow-[0_4px_0_var(--tw-colors-primary-container)] transition-transform hover:opacity-90 active:scale-[0.96] active:translate-y-[2px] active:shadow-[0_2px_0_var(--tw-colors-primary-container)]">
                删除
            </button>
</div>
</div>
</body></html>
