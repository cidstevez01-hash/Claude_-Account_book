<style>
        .paper-shadow {
            box-shadow: 0 2px 0 var(--tw-shadow-color);
        }
        .seal-shadow {
            box-shadow: 0 4px 0 #9b3e34; /* primary color */
        }
        .washi-tape {
            position: absolute;
            top: -6px;
            right: 12px;
            width: 30px;
            height: 12px;
            background-color: #f2bf48; /* tertiary-fixed-dim */
            transform: rotate(3deg);
            opacity: 0.8;
            border-radius: 1px;
        }
    </style>
</head>
<body class="bg-background min-h-screen text-on-background selection:bg-surface-variant">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface border-b-[1.5px] border-dashed border-outline-variant">
<div class="max-w-[480px] mx-auto flex items-center px-md py-xs justify-between min-h-[56px]">
<a class="text-primary hover:opacity-80 active:scale-95 transition-transform flex items-center justify-center p-2 rounded-full hover:bg-surface-variant" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</a>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight text-center flex-1">Change Password</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="max-w-[480px] mx-auto px-gutter py-xl pb-safe-bottom">
<div class="bg-surface-container-lowest rounded-paper paper-shadow shadow-outline-variant p-md relative border border-outline-variant">
<div class="washi-tape"></div>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">
                Ensure your new password is strong and unique to maintain the security of your ledger.
            </p>
<form class="space-y-lg flex flex-col">
<!-- Old Password Field -->
<div class="flex flex-col group">
<label class="font-label-caps text-label-caps text-outline mb-base uppercase" for="old_password">Old Password</label>
<div class="relative flex items-center border-b-2 border-outline-variant focus-within:border-primary transition-colors pb-sm">
<span class="material-symbols-outlined text-outline mr-sm">lock</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant" id="old_password" placeholder="Enter current password" required="" type="password"/>
<button class="text-outline hover:text-primary transition-colors ml-sm" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- New Password Field -->
<div class="flex flex-col group">
<label class="font-label-caps text-label-caps text-outline mb-base uppercase" for="new_password">New Password</label>
<div class="relative flex items-center border-b-2 border-outline-variant focus-within:border-primary transition-colors pb-sm">
<span class="material-symbols-outlined text-outline mr-sm">key</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant" id="new_password" placeholder="Enter new password" required="" type="password"/>
<button class="text-outline hover:text-primary transition-colors ml-sm" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm New Password Field -->
<div class="flex flex-col group">
<label class="font-label-caps text-label-caps text-outline mb-base uppercase" for="confirm_password">Confirm New Password</label>
<div class="relative flex items-center border-b-2 border-outline-variant focus-within:border-primary transition-colors pb-sm">
<span class="material-symbols-outlined text-outline mr-sm">done_all</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant" id="confirm_password" placeholder="Re-enter new password" required="" type="password"/>
</div>
</div>
<!-- Dashed Separator -->
<div class="w-full border-t-[1.5px] border-dashed border-outline-variant my-md"></div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-sm pt-sm mt-auto">
<button class="flex-1 py-sm px-md rounded-lg font-body-lg text-body-lg text-on-surface-variant bg-surface-variant hover:bg-surface-container-high transition-colors text-center border border-outline-variant" type="button">
                        Cancel
                    </button>
<button class="flex-1 py-sm px-md rounded-lg font-body-lg text-body-lg text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all seal-shadow text-center" type="submit">
                        Confirm
                    </button>
</div>
</form>
</div>
</main>
<script>
        // Simple password toggle logic
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const icon = this.querySelector('span.material-symbols-outlined');
                const input = this.previousElementSibling;
                if(icon && input && input.tagName === 'INPUT') {
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.textContent = 'visibility';
                    } else {
                        input.type = 'password';
                        icon.textContent = 'visibility_off';
                    }
                }
            });
        });
    </script>
</body></html>
