<h1>PigBang 日历与个人详情更新预览</h1>
<p>2026-11-21 · R-57 / B-91 · 本地隔离页面预览，统计图使用空账目状态。</p>
<h2>B-91 头像编辑按钮</h2>
<p>保留 26px 徽章，改用浅底细边框与 12px 铅笔，点击范围扩大到 44px。夏季与秋季沿用对应主题的外圈光效。</p>
<div class="compare avatar"><figure><figcaption>秋季 · 修改前</figcaption><img src="avatar-autumn-before.png" alt="修改前的大铅笔"></figure><figure><figcaption>秋季 · 新样式</figcaption><img src="avatar-autumn-after.png" alt="浅底小铅笔"></figure><figure><figcaption>夏季 · 新样式</figcaption><img src="avatar-summer-after.png" alt="夏季小铅笔"></figure></div>
<h2>R-57 统计页月份导航</h2>
<p>收支趋势和积分推移共用页顶月份。按日显示所选月份，按月显示所选月份所在年份；保留按日 / 按月与收入 / 支出切换。</p>
<div class="compare"><figure><figcaption>修改前</figcaption><img class="screen" src="stats-before.png" alt="图表内还有一组月份导航"></figure><figure><figcaption>新样式</figcaption><img class="screen" src="stats-after.png" alt="只保留页顶月份导航"></figure></div>
