<body class="bg-background text-on-background min-h-screen font-body-md">

</button>
<h1 class="font-headline-lg text-headline-md font-bold text-[#d1665a]">汇率换算</h1>
<button class="text-[#d1665a] hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[24px]">refresh</span>
</button>
</header>
<!-- Main Content -->
<main class="px-md pt-lg pb-xl flex flex-col gap-lg">

<div class="flex flex-col gap-md relative">
<!-- From Currency: JPY -->
<div class="flex flex-col gap-xs pb-4 border-b border-dashed border-outline-variant/50">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container shadow-sm">
<span class="material-symbols-outlined text-[18px]">payments</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-bold tracking-wide">JPY</span>
<span class="text-[11px] text-outline px-1.5 py-0.5 rounded bg-surface-variant/40 font-label-caps">日元</span>
<span class="material-symbols-outlined text-[18px] text-outline ml-auto">expand_more</span>
</div>
<input class="w-full bg-transparent border-0 focus:ring-0 px-0 py-1 font-input-amount text-[38px] leading-[44px] text-[#9b3e34] text-right font-bold" placeholder="0" type="number" value="100000"/>
</div>

<span class="material-symbols-outlined text-[24px]">swap_vert</span>
</button>
<!-- To Currency: CNY -->
<div class="flex flex-col gap-xs pt-2">
<div class="flex items-center justify-end gap-2">
<span class="material-symbols-outlined text-[18px] text-outline mr-auto">expand_more</span>

<span class="font-body-lg text-body-lg text-on-surface font-bold tracking-wide">CNY</span>

</div>

</div>
</div>

+0.42%

<circle cx="232" cy="70" fill="#9b3e34" fill-opacity="0.18" filter="url(#haloAura)" r="10"></circle>
