<style>
  :root{
    --paper:#EDE6D3; --card:#F6F1E4; --ink:#2A2520; --ink-soft:#8a7f6d; --ink-faint:#b5a98e;
    --seal:#a83232; --seal-soft:#c96b5f; --jade:#3f6b4a; --grid:#dcd0b0;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family:'Noto Sans SC', sans-serif; color:var(--ink); min-height:100%; overflow-x:hidden;
  }
  .app{ max-width:480px; margin:0 auto; padding: calc(var(--safe-top) + 18px) 16px calc(var(--safe-bottom) + 150px); position:relative; }
  .page{display:none;} .page.active{display:block;}
  .header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
  .header h1{font-family:'Noto Serif SC', serif; font-weight:700; font-size:26px; margin:0; letter-spacing:1px;}
  .header .month{font-size:13px; color:var(--ink-soft); margin-top:4px;}
  .header-right{display:flex;gap:8px;align-items:flex-start;}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:1.5px solid var(--grid);
    background:var(--card);font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .seal{
    width:52px;height:52px;border-radius:50%;border:2px solid var(--seal);
    display:flex;align-items:center;justify-content:center;color:var(--seal);
    font-family:'Noto Serif SC', serif;font-weight:700;font-size:13px;transform:rotate(-8deg);
    flex-shrink:0;position:relative;
  }
  .seal::before{content:'';position:absolute;inset:5px;border:1px solid var(--seal);border-radius:50%;opacity:0.6;}
  .ledger-card{background:var(--card);border:1px solid var(--grid);border-radius:18px;padding:22px 20px;box-shadow:0 2px 0 rgba(42,37,32,0.05);margin-bottom:22px;}
  .balance-label{font-size:12px;color:var(--ink-soft);letter-spacing:2px;}
  .balance-amount{font-family:'Noto Serif SC', serif;font-weight:700;font-size:38px;margin:4px 0 16px;font-variant-numeric: tabular-nums;}
  .stats-row{display:flex;gap:24px;padding-top:14px;border-top:1px dashed var(--grid);}
  .stat{flex:1;}
  .stat .lbl{font-size:12px;color:var(--ink-soft);}
  .stat .val{font-family:'Noto Serif SC', serif;font-weight:600;font-size:18px;margin-top:2px;font-variant-numeric: tabular-nums;}
  .stat.income .val{color:var(--jade);} .stat.expense .val{color:var(--seal);}
  .clickable-stat{cursor:pointer;transition:opacity 0.15s;}
  .clickable-stat:active{opacity:0.6;}
  .day-group{margin-bottom:6px;}
  .day-header{font-size:12px;color:var(--ink-soft);padding:14px 4px 8px;display:flex;justify-content:space-between;}
  .day-header .day-total{font-variant-numeric: tabular-nums;}
  .entry{background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:12px 14px;margin-bottom:8px;position:relative;overflow:hidden;}
  .entry-main{display:flex;align-items:center;gap:12px;}
  .entry .icon{font-size:22px;width:38px;height:38px;background:var(--paper);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .entry .info{flex:1; min-width:0;}
  .entry .cat{font-size:15px;font-weight:500;}
  .entry-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;}
  .pay-badge{font-size:11px;color:var(--ink-soft);background:var(--paper);border-radius:6px;padding:1px 7px;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
  .pm-badge-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:4px;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;line-height:1;}
  .note-text{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry .amount{font-family:'Noto Serif SC', serif;font-weight:600;font-size:16px;font-variant-numeric: tabular-nums;flex-shrink:0;}
  .entry.expense .amount{color:var(--seal);} .entry.income .amount{color:var(--jade);}
  .entry-actions{display:flex;gap:8px;margin-top:0;padding-top:0;border-top:1px dashed var(--grid);max-height:0;opacity:0;overflow:hidden;transition:max-height 0.22s ease, opacity 0.18s ease, margin-top 0.22s ease, padding-top 0.22s ease;}
  .entry-actions.open{max-height:70px;opacity:1;margin-top:10px;padding-top:10px;}
  .action-btn{flex:1;border:none;background:var(--paper);border-radius:10px;padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Noto Sans SC',sans-serif;}
  .action-btn .ic{font-size:16px;line-height:1;}
  .action-btn .lb{font-size:10px;color:var(--ink-soft);}
  .action-btn.edit .ic{color:var(--ink);}
  .action-btn.copy .ic{color:var(--ink-soft);}
  .action-btn.del .ic{color:var(--seal);}
  .action-btn:active{opacity:0.7;}
  .action-btn:active{opacity:0.7;}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty .big{font-size:40px;margin-bottom:10px;} .empty p{font-size:14px;line-height:1.6;margin:0;}
  .fab{position:fixed;right: max(20px, calc(50% - 240px + 20px));bottom: calc(var(--safe-bottom) + 78px);width:58px;height:58px;border-radius:50%;background:var(--seal);color:#fff;border:none;font-size:28px;box-shadow:0 6px 16px rgba(168,50,50,0.4);display:flex;align-items:center;justify-content:center;z-index:20;}
  .fab:active{transform:scale(0.94);}
  .tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--grid);display:flex;padding:6px 6px calc(var(--safe-bottom));gap:6px;z-index:15;}
  .tab-btn{flex:1;background:none;border:none;padding:8px 0 6px;margin:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-soft);font-family:'Noto Sans SC',sans-serif;position:relative;transition:background 0.2s ease, color 0.2s ease;}
  .tab-btn .ic{font-size:20px;display:inline-block;transition:transform 0.22s cubic-bezier(.34,1.56,.64,1);}
  .tab-btn.active{background:rgba(168,50,50,0.13);color:var(--seal);}
  .tab-btn.active .ic{transform:translateY(-1px) scale(1.12);}
  .tab-btn:active{opacity:0.6;}
  .overlay{position:fixed;inset:0;background:rgba(42,37,32,0.45);z-index:30;opacity:0;pointer-events:none;transition:opacity 0.25s ease;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;z-index:31;padding: 18px 20px calc(var(--safe-bottom) + 20px);transform:translateY(105%);transition:transform 0.3s cubic-bezier(.32,.72,0,1);max-width:480px;margin:0 auto;max-height:88vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,0.15);}
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--grid);border-radius:2px;margin:0 auto 14px;}
  .sheet h2{font-family:'Noto Serif SC',serif;font-size:19px;margin:0 0 16px;}
  .segment{display:flex;background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:4px;margin-bottom:16px;}
  .segment button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-size:14px;font-family:'Noto Sans SC',sans-serif;color:var(--ink-soft);}
  .segment button.active.expense{background:var(--seal);color:#fff;}
  .segment button.active.income{background:var(--jade);color:#fff;}
  .segment button.active:not(.expense):not(.income){background:var(--ink);color:var(--paper);}
  .amount-input-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ink);padding:8px 4px 12px;margin-bottom:18px;}
  .amount-input-wrap span{font-family:'Noto Serif SC',serif;font-size:24px;color:var(--ink-soft);}
  .amount-input-wrap input{border:none;background:transparent;outline:none;font-family:'Noto Serif SC',serif;font-size:32px;font-weight:600;width:100%;color:var(--ink);}
  .field-label{font-size:12px;color:var(--ink-soft);margin:0 0 8px;letter-spacing:1px;}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .cat-btn{background:var(--card);border:1.5px solid var(--grid);border-radius:12px;padding:10px 4px;text-align:center;font-family:'Noto Sans SC',sans-serif;}
  .cat-btn .ic{font-size:20px;display:block;margin-bottom:4px;}
  .cat-btn .lb{font-size:11px;color:var(--ink-soft);}
  .cat-btn.selected{border-color:var(--seal);background:#f8ece9;}
  .cat-btn.selected .lb{color:var(--seal);font-weight:600;}
  .cat-picker-row{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--grid);border-radius:12px;background:var(--card);margin-bottom:18px;font-family:'Noto Sans SC',sans-serif;}
  .cat-picker-row:active{background:var(--paper);}
  .cat-picker-icon{font-size:20px;width:34px;height:34px;background:var(--paper);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cat-picker-text{flex:1;text-align:left;font-size:15px;color:var(--ink);}
  .cat-picker-chevron{color:var(--ink-soft);font-size:18px;}
  .sub-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .sub-pill{padding:8px 14px;border-radius:20px;border:1.5px solid var(--grid);background:var(--card);font-size:13px;color:var(--ink-soft);font-family:'Noto Sans SC',sans-serif;}
  .sub-pill.selected{border-color:var(--seal);background:#f8ece9;color:var(--seal);font-weight:600;}
  .sub-pill.add-sub{border-style:dashed;color:var(--ink-soft);}
  .sub-item-wrap{display:inline-flex;align-items:center;gap:3px;}
  .sub-mini-btn{border:1px solid var(--grid);background:var(--card);border-radius:50%;width:22px;height:22px;font-size:10px;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1;flex-shrink:0;}
  .sub-mini-btn.sub-del{color:var(--seal);}
  .text-row{margin-bottom:14px;}
  .text-row input{width:100%;height:46px;padding:0 14px;border:1px solid var(--grid);border-radius:12px;background:var(--card);font-family:'Noto Sans SC',sans-serif;font-size:15px;color:var(--ink);outline:none;box-sizing:border-box;-webkit-appearance:none;appearance:none;}
  .row2{display:flex;gap:12px;align-items:stretch;} .row2 .text-row{flex:1;margin-bottom:14px;}
  .row2 .text-row input[type="date"]{width:100%;}
  .save-btn{width:100%;padding:15px;border:none;border-radius:14px;background:var(--ink);color:#F6F1E4;font-size:16px;font-weight:600;font-family:'Noto Sans SC',sans-serif;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform 0.12s ease, opacity 0.12s ease;}
  .save-btn:active{opacity:0.85;transform:scale(0.98);} .save-btn:disabled{opacity:0.5;}
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .spin-icon{display:inline-block;animation:spin 0.8s linear infinite;}
  @keyframes pulseBg{0%{background-color:var(--seal);}50%{background-color:var(--seal-soft);}100%{background-color:var(--seal);}}
  .save-btn.is-loading{animation:pulseBg 1s ease-in-out infinite;}
  .compare-row{display:flex;gap:12px;margin-bottom:16px;}
  .compare-item{flex:1;background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:14px;}
  .compare-item .lbl{font-size:12px;color:var(--ink-soft);}
  .compare-item .amt{font-family:'Noto Serif SC',serif;font-weight:600;font-size:19px;margin:5px 0 6px;font-variant-numeric:tabular-nums;}
  .compare-item.expense .amt{color:var(--seal);} .compare-item.income .amt{color:var(--jade);}
  .delta{font-size:12px;display:inline-flex;align-items:center;gap:3px;}
  .delta.up{color:var(--seal);} .delta.down{color:var(--jade);} .delta.flat{color:var(--ink-soft);}
  .chart-card{background:var(--card);border:1px solid var(--grid);border-radius:18px;padding:18px 16px;margin-bottom:18px;}
  .card-title{font-size:13px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}
  .chart-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);align-items:center;}
  .donut-wrap{position:relative;width:150px;height:150px;margin:4px auto 18px;}
  .donut-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-total{font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;}
  .donut-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .legend-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px dashed var(--grid);}
  .legend-row:last-child{border-bottom:none;}
  .legend-row .name{flex:1;font-size:13px;display:flex;align-items:center;}
  .legend-row .pct{font-size:12px;color:var(--ink-soft);width:42px;text-align:right;}
  .legend-row .amt{font-size:13px;width:82px;text-align:right;font-variant-numeric:tabular-nums;}
  .empty-chart{text-align:center;color:var(--ink-soft);font-size:13px;padding:26px 0;}
  .ym-picker{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px;}
  .ym-arrow{width:30px;height:30px;border-radius:50%;border:1px solid var(--grid);background:var(--paper);color:var(--ink-soft);font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
  .ym-arrow:active{background:var(--card);}
  .ym-label{font-family:'Noto Serif SC',serif;font-weight:600;font-size:14px;min-width:96px;text-align:center;}
  .ym-select{border:1.5px solid var(--grid);background:var(--paper);border-radius:10px;padding:8px 10px;font-family:'Noto Serif SC',serif;font-weight:600;font-size:14px;color:var(--ink);-webkit-appearance:none;appearance:none;}
  .ym-select:active{background:var(--card);}
  .chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px;}
  .chart-scroll svg{display:block;}
  .cat-legend-row{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--grid);}
  .cat-legend-row .item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft);}
  .rate-point-info{margin-top:10px;padding:10px 12px;background:var(--paper);border-radius:10px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums;}
  .rate-point-dot{cursor:pointer;}
  #homeDonutCard{cursor:pointer;}
  .donut-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:8px;padding-top:10px;border-top:1px dashed var(--grid);}
  .legend-row.clickable-legend{cursor:pointer;border-radius:10px;padding-left:6px;padding-right:6px;margin:0 -6px;transition:background 0.15s ease;}
  .legend-row.clickable-legend:active{background:var(--legend-bg, rgba(168,50,50,0.12));}
  .filter-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-radius:20px;font-size:13px;font-weight:600;margin-bottom:14px;}
  .filter-chip button{border:none;background:rgba(0,0,0,0.12);color:inherit;width:18px;height:18px;border-radius:50%;font-size:10px;display:inline-flex;align-items:center;justify-content:center;padding:0;}

  .app-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .app-toast-text{flex:1;}
  .app-toast-close{border:none;background:rgba(255,255,255,0.16);color:var(--paper);width:20px;height:20px;border-radius:50%;font-size:10px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;padding:0;}

<div class="app">

  <div class="page active" id="pageLedger">

      </div>
    </div>

        <div class="stat expense clickable-stat" data-type="expense"><div class="lbl" id="monthExpenseLabel">本月支出</div><div class="val" id="monthExpense">¥0.00</div></div>
      </div>
    </div>

    <div class="chart-card" id="homeDonutCard">

      <div class="card-title" style="margin-bottom:6px;"><span id="homeDonutTitle">本月构成</span></div>
      <div class="segment" id="homeTypeSegment" style="margin-bottom:14px;">
        <button type="button" class="active expense" data-type="expense" id="homeTypeExpenseBtn">支出</button>
        <button type="button" class="income" data-type="income" id="homeTypeIncomeBtn">收入</button>
      </div>
      <div class="donut-wrap" id="homeDonutWrap">
        <svg id="homeDonutChart" viewBox="0 0 140 140"></svg>
        <div class="donut-center"><div class="donut-total" id="homeDonutTotal">¥0</div><div class="donut-label" id="homeDonutCenterLabel">支出</div></div>
      </div>
      <div id="homeLegendList"></div>
      <div class="donut-hint" id="homeDonutHint">点击查看本月明细 ›</div>
    </div>

    <div id="listArea"></div>
  </div>

  <div class="page" id="pageStats">
    <div class="header">
      <div><h1 id="statsTitleText">统计</h1><div class="month" id="statsSubLabel">收支分析</div></div>
    </div>
    <div class="segment" id="dimSegment">
      <button type="button" class="active" data-dim="day" id="dimDayBtn">按日对比</button>
      <button type="button" data-dim="month" id="dimMonthBtn">按月对比</button>
    </div>
    <div class="compare-row" id="compareRow"></div>
    <div class="chart-card">
      <div class="ym-picker">
        <select class="ym-select" id="trendYearSelect"></select>
        <select class="ym-select" id="trendMonthSelect"></select>
      </div>
      <div class="card-title">
        <span id="trendTitle">本月每日收支</span>

      <div class="chart-scroll"><svg id="trendChart" style="height:190px;display:block;"></svg></div>
      <div class="cat-legend-row" id="trendCatLegend"></div>
    </div>
  </div>

  <div class="page" id="pageRate">
    <div class="header">
      <div><h1 id="rateTitleText">汇率</h1><div class="month" id="rateSubLabel">人民币 → 日元</div></div>
    </div>
    <div class="segment" id="rateDirSegment">

      <button type="button" data-dir="JPY_CNY" id="dirJpyCnyBtn">日元→人民币</button>
    </div>
    <div class="ledger-card">
      <div class="balance-label" id="rateBaseLabel">1 CNY</div>

</div>

<div class="tabbar">

    <button type="button" class="income" id="segIncome">收入</button>

  <button class="save-btn" id="saveBtn">保存</button>
</div>

  // 本地存储封装:这个文件是下载后独立使用的(添加到主屏幕/直接用Safari打开),
  // 不是运行在 Claude 的 artifact 预览沙盒里,所以不能用只在那个沙盒里才存在的
  // window.storage,要用浏览器原生、真正持久化的 localStorage。
  const LocalStore = {
    get(key){
      try{
        const v = localStorage.getItem(key);
        return v===null ? null : {key, value:v};
      }catch(e){ throw e; }
    },
    set(key, value){
      try{
        localStorage.setItem(key, value);
        return {key, value};
      }catch(e){ throw e; }
    }
  };

  // 存储写入偶尔会因为瞬时问题失败(如无痕模式配额限制),这里做几次自动重试;
  // 全部重试都失败才真正报错给用户,避免偶发抖动导致数据丢失却毫无提示。
  async function storageSetSafe(key, value, shared, retries){
    retries = retries==null ? 2 : retries;
    let lastErr = null;
    for(let i=0; i<=retries; i++){
      try{
        const res = LocalStore.set(key, value);
        if(res) return res;
        lastErr = new Error('Storage set returned empty result');
      }catch(e){
        lastErr = e;
      }
      if(i<retries) await sleep(300*(i+1));
    }
    throw lastErr;
  }

    { name:'frankfurter-eur', url:'https://api.frankfurter.dev/v1/latest',

  async function fetchRate(manual){
    rateLoading = true; lastRateError = ''; renderRatePage();

        lastRateError = src.name+': '+(e && e.message ? e.message : String(e));

  async function fetchOneDayRateFromCdn(dateStr){
    const urls = [
      `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${dateStr}/v1/currencies/cny.json`,
      `https://${dateStr}.currency-api.pages.dev/v1/currencies/cny.json`
    ];
    for(const url of urls){
      try{
        const data = await fetchJsonOrThrow(url);
        if(data && data.cny && typeof data.cny.jpy === 'number') return {rate: data.cny.jpy};
      }catch(e){ /* 试下一个源 */ }
    }
    return null;
  }
  const fmtDateObj = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());

  async function fetchRateHistory(){
    const dates = [];
    for(let i=29;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); dates.push(fmtDateObj(d)); }
    try{
      const results = await Promise.all(dates.map(d=> fetchOneDayRateFromCdn(d)));
      const points = dates.map((d,i)=> results[i] ? {date:d, rate:results[i].rate} : null).filter(Boolean);
      if(points.length>0){
        rateHistory = points;
        try{ await storageSetSafe('ledger_rate_history', JSON.stringify(points), false); }catch(e){ console.error('汇率历史缓存保存失败', e); }
      }
    }catch(e){ console.error('汇率历史获取失败', e); }
  }

      const y = today.getFullYear(), m = today.getMonth()-i;
      const lastDay = new Date(y, m+1, 0);
      const useDate = lastDay > today ? today : lastDay;
      items.push({label: useDate.getFullYear()+'-'+pad2(useDate.getMonth()+1), dateStr: fmtDateObj(useDate)});
    }
    try{
      const results = await Promise.all(items.map(it=> fetchOneDayRateFromCdn(it.dateStr)));
      const points = items.map((it,i)=> results[i] ? {date:it.label, rate:results[i].rate} : null).filter(Boolean);

  function renderRateTrendChart(){
    const svg = $('rateTrendChart');
    if(!svg) return;
    $('rateTrendPointInfo').style.display = 'none';
    const source = rateGranularity==='day' ? rateHistory : (rateGranularity==='month' ? rateHistoryMonthly : rateHistoryYearly);
    $('rateTrendTitle').textContent = rateGranularity==='day' ? t('rateTrend30Days') : (rateGranularity==='month' ? t('rateTrend12Months') : t('rateTrend8Years'));
    if(!source || source.length<2){
      svg.removeAttribute('width');
      svg.setAttribute('viewBox','0 0 320 140');
      svg.innerHTML = `<text x="160" y="72" font-size="11" fill="var(--ink-soft)" text-anchor="middle">${t('neverFetched')}</text>`;
      return;
    }
    const vals = source.map(p=> displayRate(p.rate));
    const W = Math.max(320, source.length* (rateGranularity==='day' ? 14 : 26));
    const H=140,top=14,base=110,left=10,right=10;
    const maxV = Math.max(...vals), minV = Math.min(...vals);
    const span = (maxV-minV) || (maxV*0.02) || 1;
    const stepX = (W-left-right)/(source.length-1);
    const pts = source.map((p,i)=>{
      const x = left+i*stepX;
      const v = displayRate(p.rate);
      const y = base-((v-minV)/span)*(base-top);
      return {x, y, date:p.date, val:v};
    });
    let path = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    let area = path+` L${pts[pts.length-1].x.toFixed(1)},${base} L${pts[0].x.toFixed(1)},${base} Z`;
    const showEvery = pts.length>12 ? Math.ceil(pts.length/8) : 1;
    let labels = '';
    let dots = '';
    pts.forEach((p,i)=>{
      const lbl = rateGranularity==='day' ? p.date.slice(5) : (rateGranularity==='month' ? p.date.slice(5)+'月' : p.date);
      if(i%showEvery===0 || i===pts.length-1){
        labels += `<text x="${p.x.toFixed(1)}" y="${base+16}" font-size="8" fill="var(--ink-soft)" text-anchor="middle">${lbl}</text>`;
      }
      dots += `<circle class="rate-point-dot" data-idx="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="transparent"/>`;
    });

  function tintColor(hex, amount){
    if(!hex || hex[0]!=='#') return 'rgba(168,50,50,0.12)';
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    const nr=Math.round(r+(255-r)*amount), ng=Math.round(g+(255-g)*amount), nb=Math.round(b+(255-b)*amount);
    return `rgb(${nr},${ng},${nb})`;
  }

  function buildDayGroupedHtml(list){
    if(list.length===0) return '';
    const sorted = [...list].sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
    const groups = {};
    sorted.forEach(e=>{ if(!groups[e.date]) groups[e.date]=[]; groups[e.date].push(e); });
    let html='';
    Object.keys(groups).forEach(date=>{
      const dlist = groups[date];
      const dayTotal = dlist.reduce((s,e)=> s + (e.type==='income'?1:-1)*toBase(e.amount, e.currency||'CNY'), 0);
      const dLabel = date===todayStr() ? t('today')+' · '+date.slice(5) : date;
      html += `<div class="day-group"><div class="day-header"><span>${dLabel}</span><span class="day-total">${dayTotal>=0?'+':'-'}${fmtCur(Math.abs(dayTotal), settings.currency)}</span></div>`;
      dlist.forEach(e=>{
        const cur = e.currency||'CNY';
        const catObj = e.catKey && allCatMap[e.catKey];
        const label = catObj ? catLabel(catObj) : e.category;
        const subObj = catObj && e.subKey ? findSub(catObj, e.subKey) : null;
        const subTxt = subObj ? subLabel(subObj) : (e.subCategory || '');
        const catLine = subTxt ? `${label} · ${subTxt}` : label;
        const pm = payMethodMap[e.paymentMethod];
        const payBadgeHtml = pm ? `<span class="pay-badge">${pmIconHtml(pm)} ${payLabel(pm)}</span>` : '';
        html += `<div class="entry ${e.type}" data-id="${e.id}">
          <div class="entry-main">
            <div class="icon">${e.icon}</div>
            <div class="info"><div class="cat">${catLine}</div><div class="entry-meta">${payBadgeHtml}${e.note? `<span class="note-text">${escapeHtml(e.note)}</span>` : ''}</div></div>
            <div class="amount">${e.type==='income'?'+':'-'}${fmtCur(e.amount, cur)}</div>
          </div>
          <div class="entry-actions">
            <button class="action-btn edit" data-act="edit"><span class="ic">✎</span><span class="lb">${t('edit')}</span></button>
            <button class="action-btn copy" data-act="copy"><span class="ic">⧉</span><span class="lb">${t('copy')}</span></button>
            <button class="action-btn del" data-act="del"><span class="ic">🗑</span><span class="lb">${t('delete')}</span></button>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    return html;
  }

  function wireEntryRows(container){
    container.querySelectorAll('.entry').forEach(row=>{
      const main = row.querySelector('.entry-main');
      const actions = row.querySelector('.entry-actions');
      main.addEventListener('click', ()=>{
        const showing = actions.classList.contains('open');
        container.querySelectorAll('.entry-actions').forEach(d=> d.classList.remove('open'));
        actions.classList.toggle('open', !showing);
      });
      actions.addEventListener('click', (ev)=>{
        const actBtn = ev.target.closest('[data-act]');
        if(!actBtn) return;
        const id = row.getAttribute('data-id');
        const act = actBtn.getAttribute('data-act');
        const entry = entries.find(e=> String(e.id)===id);
        if(act==='del'){
          entries = entries.filter(e=> String(e.id)!==id);
          saveEntries(); renderAll();
        }else if(act==='edit' && entry){
          openEntrySheetForEdit(entry);
        }else if(act==='copy' && entry){
          openEntrySheetForCopy(entry);
        }
      });
    });
  }

  function renderHomeDonut(){
    const mk = getHomeDonutMonthKey();
    $('homeMonthLabel').textContent = getHomeDonutMonthLabel();
    $('homeMonthNext').disabled = homeDonutMonthOffset>=0;
    const periodEntries = entries.filter(e=> e.date.startsWith(mk) && e.type===homeDonutType);
    $('homeDonutCenterLabel').textContent = homeDonutType==='expense' ? t('donutMonthExpense') : t('donutMonthIncome');
    const groups = {};
    periodEntries.forEach(e=>{
      const key = e.catKey || e.category;
      const v = toBase(e.amount, e.currency||'CNY');
      const catObj = e.catKey && allCatMap[e.catKey];
      const label = catObj ? catLabel(catObj) : e.category;
      if(!groups[key]) groups[key] = {key, label, icon:e.icon, amount:0};
      groups[key].amount += v;
    });
    const list = Object.values(groups).sort((a,b)=> b.amount-a.amount);
    const total = list.reduce((s,g)=>s+g.amount,0);
    $('homeDonutTotal').textContent = fmtCur(total, settings.currency);
    const donutEl = $('homeDonutChart'), legendEl = $('homeLegendList');
    if(total===0){
      donutEl.innerHTML = `<circle cx="70" cy="70" r="54" fill="none" stroke="var(--grid)" stroke-width="18"/>`;
      legendEl.innerHTML = `<div class="empty-chart">${t('emptyChart')}</div>`;
      return;
    }
    const palette=['#a83232','#3f6b4a','#b58838','#5b7a99','#7a5c3e','#8a5b7a','#4a6b8a','#c96b5f','#8a7f6d'];
    const r=54,cx=70,cy=70,circ=2*Math.PI*r;
    let offsetAcc=0, svg=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--grid)" stroke-width="18"/>`, legendHtml='';
    list.forEach((g,i)=>{
      const pct=g.amount/total*100;
      const color=(allCatMap[g.key]&&allCatMap[g.key].color)||palette[i%palette.length];
      const dash=(pct/100)*circ;
      svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="18" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offsetAcc}" stroke-linecap="butt"/>`;
      offsetAcc += dash;
      legendHtml += `<div class="legend-row clickable-legend" data-catkey="${g.key}" style="--legend-bg:${tintColor(color,0.82)};"><span class="name"><span class="legend-dot" style="background:${color}"></span>${g.icon} ${g.label}</span><span class="pct">${pct.toFixed(1)}%</span><span class="amt">${fmtCur(g.amount, settings.currency)}</span></div>`;
    });
    donutEl.innerHTML = svg;
    legendEl.innerHTML = legendHtml;
    legendEl.querySelectorAll('.clickable-legend').forEach(row=>{
      row.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        openMonthDetail(row.getAttribute('data-catkey'), getHomeDonutMonthKey());
      });
    });
  }

  async function loadCustomSubs(){
    try{
      const res = LocalStore.get('ledger_custom_subs');
      return res && res.value ? JSON.parse(res.value) : {};
    }catch(e){ return {}; }
  }
  let customSubsMap = {};
  async function initCustomSubs(){
    customSubsMap = await loadCustomSubs();
    Object.keys(customSubsMap).forEach(catKey=>{
      const cat = allCatMap[catKey];
      if(cat){
        customSubsMap[catKey].forEach(sub=>{
          if(!cat.subs.find(s=>s.key===sub.key)) cat.subs.push(sub);
        });
      }
    });
  }
  async function persistCustomSubs(){
    try{ await storageSetSafe('ledger_custom_subs', JSON.stringify(customSubsMap), false); }
    catch(e){ console.error('自定义分类保存失败', e); showToast(t('saveFailed')); }
  }
  async function addCustomSub(catKey, label){
    const sub = {key:'custom_'+Date.now(), custom:true, label:label};
    const cat = allCatMap[catKey];
    if(cat) cat.subs.push(sub);
    if(!customSubsMap[catKey]) customSubsMap[catKey] = [];
    customSubsMap[catKey].push(sub);
    await persistCustomSubs();
    return sub;
  }
  async function updateCustomSub(catKey, subKey, newLabel){
    const cat = allCatMap[catKey];
    const sub = cat && cat.subs.find(s=>s.key===subKey);
    if(sub) sub.label = newLabel;
    const stored = (customSubsMap[catKey]||[]).find(s=>s.key===subKey);
    if(stored) stored.label = newLabel;
    await persistCustomSubs();
  }
  async function deleteCustomSub(catKey, subKey){
    const cat = allCatMap[catKey];
    if(cat) cat.subs = cat.subs.filter(s=>s.key!==subKey);
    if(customSubsMap[catKey]) customSubsMap[catKey] = customSubsMap[catKey].filter(s=>s.key!==subKey);
    await persistCustomSubs();
  }
  let subInputCommitting = false;
  async function commitSubInput(){
    if($('newSubRow').style.display==='none') return;
    if(subInputCommitting) return;
    const label = $('newSubInput').value.trim();
    $('newSubRow').style.display = 'none';
    if(!label || !selectedCat){ editingSubKey = null; return; }
    subInputCommitting = true;
    if(editingSubKey){
      await updateCustomSub(selectedCat.key, editingSubKey, label);
      if(selectedSub && selectedSub.key===editingSubKey) selectedSub.label = label;
    }else{
      selectedSub = await addCustomSub(selectedCat.key, label);
    }
    editingSubKey = null;
    subInputCommitting = false;
    renderSubGrid();
    updateCatPickerRowDisplay();

  function getDailyBuckets(n){
    const arr=[];
    for(let i=n-1;i>=0;i--){
      const d=new Date(); d.setDate(d.getDate()-i);
      const key = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
      arr.push({key, label:String(d.getDate()), income:0, expense:0});
    }
    const map={}; arr.forEach(x=>map[x.key]=x);
    entries.forEach(e=>{ if(map[e.date]){ const v=toBase(e.amount, e.currency||'CNY'); if(e.type==='income') map[e.date].income+=v; else map[e.date].expense+=v; } });
    return arr;
  }
  function getMonthlyBuckets(n){
    const arr=[]; const now=new Date();
    for(let i=n-1;i>=0;i--){
      const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
      const key = d.getFullYear()+'-'+pad2(d.getMonth()+1);
      arr.push({key, label:(d.getMonth()+1)+'月', income:0, expense:0});
    }
    const map={}; arr.forEach(x=>map[x.key]=x);
    entries.forEach(e=>{ const mk=e.date.slice(0,7); if(map[mk]){ const v=toBase(e.amount, e.currency||'CNY'); if(e.type==='income') map[mk].income+=v; else map[mk].expense+=v; } });
    return arr;
  }

  // 用于图表的分桶,额外附带各分类的金额,好把柱状图画成按分类上色的堆叠柱
  function getDailyBucketsForMonth(year, month){
    const daysInMonth = new Date(year, month, 0).getDate();
    const arr=[];
    for(let d=1; d<=daysInMonth; d++){
      arr.push({key:year+'-'+pad2(month)+'-'+pad2(d), label:String(d), income:0, expense:0, catExpense:{}, catIncome:{}});
    }
    const map={}; arr.forEach(x=>map[x.key]=x);
    entries.forEach(e=>{
      const b = map[e.date];
      if(!b) return;
      const v = toBase(e.amount, e.currency||'CNY');
      const k = e.catKey || e.category;
      if(e.type==='income'){ b.income+=v; b.catIncome[k]=(b.catIncome[k]||0)+v; }
      else{ b.expense+=v; b.catExpense[k]=(b.catExpense[k]||0)+v; }
    });
    return arr;
  }
  function getMonthlyBucketsForYear(year){
    const arr=[];
    for(let m=1;m<=12;m++){
      arr.push({key:year+'-'+pad2(m), label:m+'月', income:0, expense:0, catExpense:{}, catIncome:{}});
    }
    const map={}; arr.forEach(x=>map[x.key]=x);
    entries.forEach(e=>{
      const mk = e.date.slice(0,7);
      const b = map[mk];
      if(!b) return;
      const v = toBase(e.amount, e.currency||'CNY');
      const k = e.catKey || e.category;
      if(e.type==='income'){ b.income+=v; b.catIncome[k]=(b.catIncome[k]||0)+v; }
      else{ b.expense+=v; b.catExpense[k]=(b.catExpense[k]||0)+v; }
    });
    return arr;
  }

  function pctChange(cur,prev){
    if(prev===0){ return cur===0? {v:0,na:false} : {v:null,na:true}; }
    return {v: ((cur-prev)/prev*100), na:false};
  }
  function deltaHtml(cur, prev, goodDirection){
    const r = pctChange(cur,prev);
    if(r.na) return `<span class="delta up">▲ ${t('newIncrease')}</span>`;
    const v = r.v;
    const dir = v>0.001 ? 'up' : (v<-0.001 ? 'down' : 'flat');
    let cls;
    if(dir==='flat') cls='flat';
    else if(goodDirection==='down') cls = dir==='down' ? 'down' : 'up';
    else cls = dir==='up' ? 'up' : 'down';
    const arrow = dir==='up' ? '▲' : (dir==='down' ? '▼' : '–');
    return `<span class="delta ${cls}">${arrow} ${Math.abs(v).toFixed(1)}%</span>`;
  }
  function renderCompare(){
    let cur, prev, curLbl, prevLbl;
    if(currentDim==='day'){ const b=getDailyBuckets(2); prev=b[0]; cur=b[1]; curLbl=t('today'); prevLbl=t('yesterday'); }
    else{ const b=getMonthlyBuckets(2); prev=b[0]; cur=b[1]; curLbl=t('thisMonth'); prevLbl=t('lastMonth'); }
    const tplE = t('compareTemplate').replace('{cur}',curLbl).replace('{type}',t('expenseWord')).replace('{prev}',prevLbl);
    const tplI = t('compareTemplate').replace('{cur}',curLbl).replace('{type}',t('incomeWord')).replace('{prev}',prevLbl);
    $('compareRow').innerHTML = `
      <div class="compare-item expense"><div class="lbl">${tplE}</div><div class="amt">${fmtCur(cur.expense, settings.currency)}</div>${deltaHtml(cur.expense, prev.expense, 'down')}</div>
      <div class="compare-item income"><div class="lbl">${tplI}</div><div class="amt">${fmtCur(cur.income, settings.currency)}</div>${deltaHtml(cur.income, prev.income, 'up')}</div>
    `;
  }

  let statsDayYear, statsDayMonth, statsMonthYear;
  (function initStatsYm(){
    const now = new Date();
    statsDayYear = now.getFullYear(); statsDayMonth = now.getMonth()+1;
    statsMonthYear = now.getFullYear();
  })();

  const CHART_PALETTE = ['#a83232','#3f6b4a','#b58838','#5b7a99','#7a5c3e','#8a5b7a','#4a6b8a','#c96b5f','#8a7f6d'];
  function colorForKey(key, fallbackIdx){
    return (allCatMap[key] && allCatMap[key].color) || CHART_PALETTE[fallbackIdx % CHART_PALETTE.length];
  }
  function labelForKey(key){
    const cat = allCatMap[key];
    return cat ? catLabel(cat) : key;
  }

  function renderTrendChart(){
    let buckets;
    if(currentDim==='day'){
      buckets = getDailyBucketsForMonth(statsDayYear, statsDayMonth);
      $('trendTitle').textContent = t('trendDayTitle');
    }else{
      buckets = getMonthlyBucketsForYear(statsMonthYear);
      $('trendTitle').textContent = t('trendMonthTitle');
    }
    syncStatsYmSelects();
    const maxVal = Math.max(1, ...buckets.map(b=>Math.max(b.income,b.expense)));
    const top=14, base=150, chartH=190, barW=13, barGap=3, groupPad=13;
    const groupW = barW*2+barGap+groupPad;
    const totalW = Math.max(300, buckets.length*groupW+20);
    const svgEl = $('trendChart');
    svgEl.setAttribute('viewBox', `0 0 ${totalW} ${chartH}`);
    svgEl.setAttribute('width', totalW);
    svgEl.style.width = totalW+'px';

    let svg = `<line x1="8" y1="${base}" x2="${totalW-8}" y2="${base}" stroke="var(--grid)" stroke-width="1"/>`;
    const expTotals={}, incTotals={};
    buckets.forEach((b,i)=>{
      const x0 = 10 + i*groupW;
      let y = base;
      Object.entries(b.catExpense).sort((a,c)=>c[1]-a[1]).forEach(([k,v])=>{
        expTotals[k]=(expTotals[k]||0)+v;
        const h = (v/maxVal)*(base-top);
        svg += `<rect x="${x0}" y="${(y-h).toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" fill="${colorForKey(k,0)}"/>`;
        y -= h;
      });
      let y2 = base;
      Object.entries(b.catIncome).sort((a,c)=>c[1]-a[1]).forEach(([k,v])=>{
        incTotals[k]=(incTotals[k]||0)+v;
        const h = (v/maxVal)*(base-top);
        svg += `<rect x="${x0+barW+barGap}" y="${(y2-h).toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" fill="${colorForKey(k,1)}"/>`;
        y2 -= h;
      });
      svg += `<text x="${x0+barW+barGap/2}" y="${base+16}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${b.label}</text>`;
    });
    svgEl.innerHTML = svg;

    const merged = {...expTotals};
    Object.entries(incTotals).forEach(([k,v])=> merged[k]=(merged[k]||0)+v);
    const legendKeys = Object.entries(merged).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k])=>k);
    $('trendCatLegend').innerHTML = legendKeys.map((k,i)=>
      `<span class="item"><span class="legend-dot" style="background:${colorForKey(k,i)}"></span>${labelForKey(k)}</span>`
    ).join('');
  }

  function populateStatsYmSelects(){
    const nowY = new Date().getFullYear();
    const minY = nowY - 8;
    let yearsHtml = '';
    for(let y=nowY; y>=minY; y--) yearsHtml += `<option value="${y}">${y}年</option>`;
    $('trendYearSelect').innerHTML = yearsHtml;
    let monthsHtml = '';

  function syncStatsYmSelects(){
    if(currentDim==='day'){

  // 固定每月收入规则:每个月自动补一笔工资收入(不会重复生成,也不会补历史月份)
  const RECURRING_RULES = [
    { id:'rule_salary_default', type:'income', amount:289346, currency:'JPY', catKey:'salary', subKey:'salary_base', dayOfMonth:25, paymentMethod:'transfer' }
  ];
  async function ensureRecurringEntries(){
    const mk = currentMonthKey();
    let changed = false;
    RECURRING_RULES.forEach(rule=>{
      const exists = entries.some(e=> e.recurringId===rule.id && e.date.startsWith(mk));
      if(!exists){
        const catObj = allCatMap[rule.catKey];
        const subObj = findSub(catObj, rule.subKey);
        entries.push({
          id: 'recur_'+rule.id+'_'+mk,
          type: rule.type, amount: rule.amount, currency: rule.currency,
          category: catLabel(catObj), catKey: rule.catKey,
          subCategory: subObj? subLabel(subObj) : '', subKey: rule.subKey,
          paymentMethod: rule.paymentMethod || 'cash',
          icon: catObj.icon, note:'', date: mk+'-'+pad2(rule.dayOfMonth),
          createdAt: Date.now(), recurringId: rule.id
        });
        changed = true;
      }
    });
    if(changed) await saveEntries();
  }

  async function init(){
    const step = async (name, fn) => {
      try{ await fn(); }
      catch(e){ console.error('初始化步骤失败: '+name, e); }
    };
    await step('loadSettings', loadSettings);
    await step('initCustomSubs', initCustomSubs);
    await step('applyStaticI18n', applyStaticI18n);
    await step('setMonthLabel', setMonthLabel);
    await step('loadRateCache', loadRateCache);
    await step('loadEntries', loadEntries);
    await step('ensureRecurringEntries', ensureRecurringEntries);
    await step('renderAll', renderAll);
    await step('renderRatePage', renderRatePage);
    fetchRate(false).catch(e=> console.error('汇率初始拉取失败', e));
  }
  init();
})();
