<style>
  :root{
    --paper:#F7F1E7; --card:#FFFDF8; --ink:#3a2f28; --ink-soft:#a99c86; --ink-faint:#cfc3ac;
    --seal:#d1665a; --seal-soft:#e2897d; --jade:#7a9b6e; --grid:#e7dcc4; --grid-bg:#e3e7dd; --accent:#e3b23c;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--grid-bg) 1px, transparent 1px),linear-gradient(90deg, var(--grid-bg) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family:'Noto Sans SC', sans-serif; color:var(--ink); min-height:100%; overflow-x:hidden;
  }
  .hd-icon{width:20px;height:20px;display:inline-block;vertical-align:-4px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .papercut{
    color:var(--seal); font-weight:800; position:relative; display:inline-block;
    text-shadow:1.5px 0 0 var(--card), -1.5px 0 0 var(--card), 0 1.5px 0 var(--card), 0 -1.5px 0 var(--card),
                1px 1px 0 var(--card), -1px -1px 0 var(--card), 1px -1px 0 var(--card), -1px 1px 0 var(--card),
                3px 4px 0 rgba(58,47,40,0.16);
  }
  .washi-tape{position:absolute;top:-8px;left:14px;width:56px;height:20px;background:repeating-linear-gradient(-45deg, rgba(227,178,60,0.55) 0 6px, rgba(227,178,60,0.32) 6px 12px);transform:rotate(-5deg);border-radius:2px;opacity:0.9;pointer-events:none;}
  .app{ max-width:480px; margin:0 auto; padding: calc(var(--safe-top) + 18px) 16px calc(var(--safe-bottom) + 150px); position:relative; }
  .page{display:none;} .page.active{display:block;}
  .header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; position:relative;}
  .header h1{font-family:'Noto Serif SC', serif; font-weight:700; font-size:26px; margin:0; letter-spacing:1px;}
  .header .month{font-size:13px; color:var(--ink-soft); margin-top:4px;}
  .header-right{display:flex;gap:8px;align-items:flex-start;}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:2px dashed var(--grid);
    background:var(--card);font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }

    <div id="listArea"></div>

  <div class="page" id="pageStats">

      </div>
      <div class="chart-scroll"><svg id="trendChart" style="height:190px;display:block;"></svg></div>
      <div class="cat-legend-row" id="trendCatLegend"></div>
    </div>
  </div>

  <div class="page" id="pageRate">
    <div class="header">
      <div><h1 id="rateTitleText" class="papercut">汇率</h1><div class="month" id="rateSubLabel">人民币 → 日元</div></div>
    </div>
    <div class="segment" id="rateDirSegment">
      <button type="button" class="active" data-dir="CNY_JPY" id="dirCnyJpyBtn">人民币→日元</button>
      <button type="button" data-dir="JPY_CNY" id="dirJpyCnyBtn">日元→人民币</button>

    <div class="ledger-card">
      <div class="balance-label" id="rateBaseLabel">1 CNY</div>
      <div class="balance-amount" id="rateValue">--</div>

        <div class="stat"><div class="lbl" id="rateUpdateLabel">更新时间</div><div class="val" id="rateUpdateTime">--</div></div>
      </div>

    <div class="chart-card">

        <button type="button" class="active" data-gran="day" id="granDayBtn">近30天</button>

      <div class="chart-scroll"><svg id="rateTrendChart" style="height:150px;display:block;"></svg></div>
      <div id="rateTrendPointInfo" class="rate-point-info" style="display:none;"></div>

  // 本地存储封装:这个文件是下载后独立使用的(添加到主屏幕/直接用Safari打开),
  // 不是运行在 Claude 的 artifact 预览沙盒里,所以不能用只在那个沙盒里才存在的
  // window.storage,要用浏览器原生、真正持久化的 localStorage。
  const LocalStore = {
    get(key){
      try{
        const v = localStorage.getItem(key);
        return v===null ? null : {key, value:v};
      }catch(e){ throw e; }
    },
    set(key, value){
      try{
        localStorage.setItem(key, value);
        return {key, value};
      }catch(e){ throw e; }
    }
  };

  // 存储写入偶尔会因为瞬时问题失败(如无痕模式配额限制),这里做几次自动重试;
  // 全部重试都失败才真正报错给用户,避免偶发抖动导致数据丢失却毫无提示。
  async function storageSetSafe(key, value, shared, retries){
    retries = retries==null ? 2 : retries;
    let lastErr = null;
    for(let i=0; i<=retries; i++){
      try{
        const res = LocalStore.set(key, value);
        if(res) return res;
        lastErr = new Error('Storage set returned empty result');
      }catch(e){
        lastErr = e;
      }
      if(i<retries) await sleep(300*(i+1));
    }
    throw lastErr;
  }

  // ---------- GitHub Gist 云备份 ----------
  function scheduleGistBackup(){
    if(!settings.githubToken) return;
    clearTimeout(gistBackupTimer);
    gistBackupTimer = setTimeout(()=> pushBackupToGist(false), 2500);
  }
  function buildBackupPayload(){
    const safeSettings = {lang: settings.lang, currency: settings.currency};
    return JSON.stringify({version:1, exportedAt: Date.now(), entries, settings: safeSettings, customSubs: customSubsMap}, null, 2);
  }
  async function pushBackupToGist(manual){
    const token = (settings.githubToken||'').trim();
    if(!token){ if(manual) showToast(t('backupNeedToken')); return; }
    if(gistSyncing) return;
    gistSyncing = true; renderBackupStatus();
    try{
      const gistId = (settings.gistId||'').trim();
      const url = gistId ? `https://api.github.com/gists/${gistId}` : 'https://api.github.com/gists';
      const res = await fetch(url, {
        method: gistId ? 'PATCH' : 'POST',
        headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
        body: JSON.stringify({description:'记账本自动备份 - 请勿手动删除', public:false, files:{'accountbook-backup.json':{content: buildBackupPayload()}}})
      });
      if(res.status===401 || res.status===403){ if(manual) showToast(t('backupErrorAuth')); return; }
      if(res.status===404 && gistId){
        settings.gistId = '';
        gistSyncing = false;
        await pushBackupToGist(manual);
        return;
      }
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      settings.gistId = data.id;
      settings.lastSyncAt = Date.now();
      $('gistIdInput').value = settings.gistId;
      await storageSetSafe('ledger_settings', JSON.stringify(settings), false);
    }catch(e){
      console.error('Gist 备份失败', e);
      if(manual) showToast(t('backupErrorNetwork'));
    }finally{
      gistSyncing = false;
      renderBackupStatus();
    }
  }
  async function pullBackupFromGist(){
    const token = (settings.githubToken||'').trim();
    const gistId = (settings.gistId||'').trim();
    if(!token || !gistId){ showToast(t('restoreNeedInfo')); return; }
    if(!confirm(t('restoreConfirm'))) return;
    gistSyncing = true; renderBackupStatus();
    try{
      const res = await fetch(`https://api.github.com/gists/${gistId}`, {
        headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json' }
      });
      if(res.status===401 || res.status===403){ showToast(t('backupErrorAuth')); return; }
      if(res.status===404){ showToast(t('restoreErrorNotFound')); return; }
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      const file = data.files && data.files['accountbook-backup.json'];
      if(!file || !file.content) throw new Error('empty backup');
      const payload = JSON.parse(file.content);
      entries = Array.isArray(payload.entries) ? payload.entries : [];
      customSubsMap = payload.customSubs && typeof payload.customSubs==='object' ? payload.customSubs : {};
      if(payload.settings){
        settings.lang = payload.settings.lang || settings.lang;
        settings.currency = payload.settings.currency || settings.currency;
      }
      await storageSetSafe('ledger_entries', JSON.stringify(entries), false);
      await storageSetSafe('ledger_custom_subs', JSON.stringify(customSubsMap), false);
      await storageSetSafe('ledger_settings', JSON.stringify(settings), false);
      showToast(t('restoreSuccess'));
      setTimeout(()=> location.reload(), 700);
    }catch(e){
      console.error('Gist 恢复失败', e);
      showToast(t('restoreErrorParse'));
    }finally{
      gistSyncing = false;
      renderBackupStatus();
    }
  }

  async function fetchRate(manual){
    rateLoading = true; lastRateError = ''; renderRatePage();
    let ok = false;
    for(const src of RATE_SOURCES){
      try{
        const data = await fetchJsonOrThrow(src.url);
        const result = src.parse(data);
        if(result){
          rateData = {rate:result.rate, date:result.date, fetchedAt:Date.now(), source:src.name};
          ok = true;
          break;
        }
        lastRateError = src.name+': 数据格式不符';
      }catch(e){
        lastRateError = src.name+': '+(e && e.message ? e.message : String(e));
        console.error('汇率获取失败', src.name, e);
      }
    }
    if(ok){
      lastRateError = '';
      try{ await storageSetSafe('ledger_rate', JSON.stringify(rateData), false); }catch(e){ console.error('汇率缓存保存失败', e); }
    }
    await fetchRateHistory();
    await fetchRateHistoryMonthly();
    await fetchRateHistoryYearly();
    rateLoading = false; renderRatePage();
  }

  async function fetchOneDayRateFromCdn(dateStr){
    const urls = [
      `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${dateStr}/v1/currencies/cny.json`,
      `https://${dateStr}.currency-api.pages.dev/v1/currencies/cny.json`
    ];
    for(const url of urls){
      try{
        const data = await fetchJsonOrThrow(url);
        if(data && data.cny && typeof data.cny.jpy === 'number') return {rate: data.cny.jpy};
      }catch(e){ /* 试下一个源 */ }
    }
    return null;
  }
  const fmtDateObj = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());

  async function fetchRateHistory(){
    const dates = [];
    for(let i=29;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); dates.push(fmtDateObj(d)); }
    try{
      const results = await Promise.all(dates.map(d=> fetchOneDayRateFromCdn(d)));
      const points = dates.map((d,i)=> results[i] ? {date:d, rate:results[i].rate} : null).filter(Boolean);
      if(points.length>0){
        rateHistory = points;
        try{ await storageSetSafe('ledger_rate_history', JSON.stringify(points), false); }catch(e){ console.error('汇率历史缓存保存失败', e); }
      }
    }catch(e){ console.error('汇率历史获取失败', e); }
  }

  async function fetchRateHistoryMonthly(){
    const today = new Date();
    const items = [];
    for(let i=11;i>=0;i--){
      const y = today.getFullYear(), m = today.getMonth()-i;
      const lastDay = new Date(y, m+1, 0);
      const useDate = lastDay > today ? today : lastDay;
      items.push({label: useDate.getFullYear()+'-'+pad2(useDate.getMonth()+1), dateStr: fmtDateObj(useDate)});
    }
    try{
      const results = await Promise.all(items.map(it=> fetchOneDayRateFromCdn(it.dateStr)));
      const points = items.map((it,i)=> results[i] ? {date:it.label, rate:results[i].rate} : null).filter(Boolean);
      if(points.length>0){
        rateHistoryMonthly = points;
        try{ await storageSetSafe('ledger_rate_history_monthly', JSON.stringify(points), false); }catch(e){ console.error('月度汇率历史缓存保存失败', e); }
      }
    }catch(e){ console.error('月度汇率历史获取失败', e); }
  }

  async function fetchRateHistoryYearly(){
    const today = new Date();
    const items = [];
    for(let i=7;i>=0;i--){
      const y = today.getFullYear()-i;
      const lastDay = new Date(y, 11, 31);
      const useDate = lastDay > today ? today : lastDay;
      items.push({label:String(y), dateStr: fmtDateObj(useDate)});
    }
    try{
      const results = await Promise.all(items.map(it=> fetchOneDayRateFromCdn(it.dateStr)));
      const points = items.map((it,i)=> results[i] ? {date:it.label, rate:results[i].rate} : null).filter(Boolean);
      if(points.length>0){
        rateHistoryYearly = points;
        try{ await storageSetSafe('ledger_rate_history_yearly', JSON.stringify(points), false); }catch(e){ console.error('年度汇率历史缓存保存失败', e); }
      }
    }catch(e){ console.error('年度汇率历史获取失败', e); }
  }

  function renderRateTrendChart(){
    const svg = $('rateTrendChart');
    if(!svg) return;
    $('rateTrendPointInfo').style.display = 'none';
    const source = rateGranularity==='day' ? rateHistory : (rateGranularity==='month' ? rateHistoryMonthly : rateHistoryYearly);
    $('rateTrendTitle').textContent = rateGranularity==='day' ? t('rateTrend30Days') : (rateGranularity==='month' ? t('rateTrend12Months') : t('rateTrend8Years'));
    if(!source || source.length<2){
      svg.removeAttribute('width');
      svg.setAttribute('viewBox','0 0 320 140');
      svg.innerHTML = `<text x="160" y="72" font-size="11" fill="var(--ink-soft)" text-anchor="middle">${t('neverFetched')}</text>`;
      return;
    }
    const vals = source.map(p=> displayRate(p.rate));
    const W = Math.max(320, source.length* (rateGranularity==='day' ? 14 : 26));
    const H=140,top=14,base=110,left=10,right=10;
    const maxV = Math.max(...vals), minV = Math.min(...vals);
    const span = (maxV-minV) || (maxV*0.02) || 1;
    const stepX = (W-left-right)/(source.length-1);
    const pts = source.map((p,i)=>{
      const x = left+i*stepX;
      const v = displayRate(p.rate);
      const y = base-((v-minV)/span)*(base-top);
      return {x, y, date:p.date, val:v};
    });
    let path = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    let area = path+` L${pts[pts.length-1].x.toFixed(1)},${base} L${pts[0].x.toFixed(1)},${base} Z`;
    const showEvery = pts.length>12 ? Math.ceil(pts.length/8) : 1;
    let labels = '';
    let dots = '';
    pts.forEach((p,i)=>{
      const lbl = rateGranularity==='day' ? p.date.slice(5) : (rateGranularity==='month' ? p.date.slice(5)+'月' : p.date);
      if(i%showEvery===0 || i===pts.length-1){
        labels += `<text x="${p.x.toFixed(1)}" y="${base+16}" font-size="8" fill="var(--ink-soft)" text-anchor="middle">${lbl}</text>`;
      }
      dots += `<circle class="rate-point-dot" data-idx="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="transparent"/>`;
    });
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W);
    svg.style.width = W+'px';
    svg.innerHTML = `
      <line x1="${left}" y1="${base}" x2="${W-right}" y2="${base}" stroke="var(--grid)" stroke-width="1"/>
      <path d="${area}" fill="var(--seal)" opacity="0.08"/>
      <path d="${path}" fill="none" stroke="var(--seal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${labels}
      ${dots}
      <circle id="rateSelRing" r="10" fill="none" stroke="var(--seal)" stroke-width="2" style="display:none;pointer-events:none;" opacity="0.35"/>
      <circle id="rateSelMarker" r="5" fill="var(--seal)" stroke="#fff" stroke-width="2" style="display:none;pointer-events:none;"/>
    `;
    // 默认高亮最后一个点(最新数据),点击任意点会把这个标记移过去,让用户清楚看到自己点在哪
    if(selectedRatePointIdx==null || selectedRatePointIdx>=pts.length) selectedRatePointIdx = pts.length-1;
    showRateSelMarker(pts[selectedRatePointIdx], selectedRatePointIdx);
    svg.querySelectorAll('.rate-point-dot').forEach(dot=>{
      dot.addEventListener('click', ()=>{
        const idx = parseInt(dot.getAttribute('data-idx'),10);
        selectedRatePointIdx = idx;
        showRateSelMarker(pts[idx], idx);
      });
    });
  }
  let selectedRatePointIdx = null;
  function showRateSelMarker(p, idx){
    if(!p) return;
    const svg = $('rateTrendChart');
    const ring = svg.querySelector('#rateSelRing');
    const marker = svg.querySelector('#rateSelMarker');
    if(!ring || !marker) return;
    ring.setAttribute('cx', p.x.toFixed(1)); ring.setAttribute('cy', p.y.toFixed(1)); ring.style.display = 'block';

    $('rateTrendPointInfo').style.display = 'block';
    $('rateTrendPointInfo').textContent = `${p.date} · ${p.val.toFixed(4)} ${rateUnitLabel()}`;
  }

  function tintColor(hex, amount){
    if(!hex || hex[0]!=='#') return 'rgba(209,102,90,0.12)';
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    const nr=Math.round(r+(255-r)*amount), ng=Math.round(g+(255-g)*amount), nb=Math.round(b+(255-b)*amount);
    return `rgb(${nr},${ng},${nb})`;
  }

  function buildDayGroupedHtml(list){
    if(list.length===0) return '';
    const sorted = [...list].sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
    const groups = {};
    sorted.forEach(e=>{ if(!groups[e.date]) groups[e.date]=[]; groups[e.date].push(e); });
    let html='';
    Object.keys(groups).forEach(date=>{
      const dlist = groups[date];
      const dayTotal = dlist.reduce((s,e)=> s + (e.type==='income'?1:-1)*toBase(e.amount, e.currency||'CNY'), 0);
      const dLabel = date===todayStr() ? t('today')+' · '+date.slice(5) : date;
      html += `<div class="day-group"><div class="day-header"><span>${dLabel}</span><span class="day-total">${dayTotal>=0?'+':'-'}${fmtCur(Math.abs(dayTotal), settings.currency)}</span></div>`;
      dlist.forEach(e=>{
        const cur = e.currency||'CNY';
        const catObj = e.catKey && allCatMap[e.catKey];
        const label = catObj ? catLabel(catObj) : e.category;
        const subObj = catObj && e.subKey ? findSub(catObj, e.subKey) : null;
        const subTxt = subObj ? subLabel(subObj) : (e.subCategory || '');
        const catLine = subTxt ? `${label} · ${subTxt}` : label;
        const pm = payMethodMap[e.paymentMethod];
        const payBadgeHtml = pm ? `<span class="pay-badge">${pmIconHtml(pm)} ${payLabel(pm)}</span>` : '';
        const iconBg = catObj ? tintColor(catObj.color, 0.85) : 'var(--paper)';
        const iconColor = catObj ? catObj.color : 'var(--ink-soft)';
        const iconHtml = catObj ? iconSvg(catObj.icon) : '';
        html += `<div class="entry ${e.type}" data-id="${e.id}">
          <div class="entry-main">
            <div class="icon" style="background:${iconBg};color:${iconColor}">${iconHtml}</div>
            <div class="info"><div class="cat">${catLine}</div><div class="entry-meta">${payBadgeHtml}${e.note? `<span class="note-text">${escapeHtml(e.note)}</span>` : ''}</div></div>
            <div class="amount">${e.type==='income'?'+':'-'}${fmtCur(e.amount, cur)}</div>
          </div>
          <div class="entry-actions">
            <button class="action-btn edit" data-act="edit">${iconSvg('pencil')}<span class="lb">${t('edit')}</span></button>
            <button class="action-btn copy" data-act="copy">${iconSvg('copy')}<span class="lb">${t('copy')}</span></button>
            <button class="action-btn del" data-act="del">${iconSvg('trash')}<span class="lb">${t('delete')}</span></button>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    return html;
  }

  function wireEntryRows(container){
    container.querySelectorAll('.entry').forEach(row=>{
      const main = row.querySelector('.entry-main');
      const actions = row.querySelector('.entry-actions');
      main.addEventListener('click', ()=>{
        const showing = actions.classList.contains('open');
        container.querySelectorAll('.entry-actions').forEach(d=> d.classList.remove('open'));
        actions.classList.toggle('open', !showing);
      });
      actions.addEventListener('click', (ev)=>{
        const actBtn = ev.target.closest('[data-act]');
        if(!actBtn) return;
        const id = row.getAttribute('data-id');
        const act = actBtn.getAttribute('data-act');
        const entry = entries.find(e=> String(e.id)===id);
        if(act==='del'){
          entries = entries.filter(e=> String(e.id)!==id);
          saveEntries(); renderAll();
        }else if(act==='edit' && entry){
          openEntrySheetForEdit(entry);
        }else if(act==='copy' && entry){
          openEntrySheetForCopy(entry);
        }
      });
    });
  }

  async function initCustomSubs(){
    customSubsMap = await loadCustomSubs();
    Object.keys(customSubsMap).forEach(catKey=>{
      const cat = allCatMap[catKey];
      if(cat){

          if(!cat.subs.find(s=>s.key===sub.key)) cat.subs.push(sub);
        });
      }
    });
  }
  async function persistCustomSubs(){
    try{ await storageSetSafe('ledger_custom_subs', JSON.stringify(customSubsMap), false); scheduleGistBackup(); }
    catch(e){ console.error('自定义分类保存失败', e); showToast(t('saveFailed')); }

  async function addCustomSub(catKey, label){
    const sub = {key:'custom_'+Date.now(), custom:true, label:label};
    const cat = allCatMap[catKey];
    if(cat) cat.subs.push(sub);
    if(!customSubsMap[catKey]) customSubsMap[catKey] = [];
    customSubsMap[catKey].push(sub);
    await persistCustomSubs();
    return sub;
  }
  async function updateCustomSub(catKey, subKey, newLabel){
    const cat = allCatMap[catKey];
    const sub = cat && cat.subs.find(s=>s.key===subKey);
    if(sub) sub.label = newLabel;
    const stored = (customSubsMap[catKey]||[]).find(s=>s.key===subKey);
    if(stored) stored.label = newLabel;
    await persistCustomSubs();
  }
  async function deleteCustomSub(catKey, subKey){
    const cat = allCatMap[catKey];
    if(cat) cat.subs = cat.subs.filter(s=>s.key!==subKey);
    if(customSubsMap[catKey]) customSubsMap[catKey] = customSubsMap[catKey].filter(s=>s.key!==subKey);
    await persistCustomSubs();
  }

  function getDailyBuckets(n){
    const arr=[];
    for(let i=n-1;i>=0;i--){
      const d=new Date(); d.setDate(d.getDate()-i);
      const key = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
      arr.push({key, label:String(d.getDate()), income:0, expense:0});
    }
    const map={}; arr.forEach(x=>map[x.key]=x);
    entries.forEach(e=>{ if(map[e.date]){ const v=toBase(e.amount, e.currency||'CNY'); if(e.type==='income') map[e.date].income+=v; else map[e.date].expense+=v; } });
    return arr;
  }
  function getMonthlyBuckets(n){
    const arr=[]; const now=new Date();
    for(let i=n-1;i>=0;i--){
      const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
      const key = d.getFullYear()+'-'+pad2(d.getMonth()+1);
      arr.push({key, label:(d.getMonth()+1)+'月', income:0, expense:0});
    }
    const map={}; arr.forEach(x=>map[x.key]=x);
    entries.forEach(e=>{ const mk=e.date.slice(0,7); if(map[mk]){ const v=toBase(e.amount, e.currency||'CNY'); if(e.type==='income') map[mk].income+=v; else map[mk].expense+=v; } });
    return arr;
  }

  // 用于图表的分桶,额外附带各分类的金额,好把柱状图画成按分类上色的堆叠柱
  function getDailyBucketsForMonth(year, month){
    const daysInMonth = new Date(year, month, 0).getDate();
    const arr=[];
    for(let d=1; d<=daysInMonth; d++){
      arr.push({key:year+'-'+pad2(month)+'-'+pad2(d), label:String(d), income:0, expense:0, catExpense:{}, catIncome:{}});
    }
    const map={}; arr.forEach(x=>map[x.key]=x);
    entries.forEach(e=>{
      const b = map[e.date];
      if(!b) return;
      const v = toBase(e.amount, e.currency||'CNY');
      const k = e.catKey || e.category;
      if(e.type==='income'){ b.income+=v; b.catIncome[k]=(b.catIncome[k]||0)+v; }
      else{ b.expense+=v; b.catExpense[k]=(b.catExpense[k]||0)+v; }
    });
    return arr;
  }
  function getMonthlyBucketsForYear(year){
    const arr=[];
    for(let m=1;m<=12;m++){
      arr.push({key:year+'-'+pad2(m), label:m+'月', income:0, expense:0, catExpense:{}, catIncome:{}});
    }
    const map={}; arr.forEach(x=>map[x.key]=x);
    entries.forEach(e=>{
      const mk = e.date.slice(0,7);
      const b = map[mk];
      if(!b) return;
      const v = toBase(e.amount, e.currency||'CNY');
      const k = e.catKey || e.category;
      if(e.type==='income'){ b.income+=v; b.catIncome[k]=(b.catIncome[k]||0)+v; }
      else{ b.expense+=v; b.catExpense[k]=(b.catExpense[k]||0)+v; }
    });
    return arr;
  }

  function pctChange(cur,prev){
    if(prev===0){ return cur===0? {v:0,na:false} : {v:null,na:true}; }
    return {v: ((cur-prev)/prev*100), na:false};
  }
  function deltaHtml(cur, prev, goodDirection){
    const r = pctChange(cur,prev);
    if(r.na) return `<span class="delta up">▲ ${t('newIncrease')}</span>`;
    const v = r.v;
    const dir = v>0.001 ? 'up' : (v<-0.001 ? 'down' : 'flat');
    let cls;
    if(dir==='flat') cls='flat';
    else if(goodDirection==='down') cls = dir==='down' ? 'down' : 'up';
    else cls = dir==='up' ? 'up' : 'down';
    const arrow = dir==='up' ? '▲' : (dir==='down' ? '▼' : '–');
    return `<span class="delta ${cls}">${arrow} ${Math.abs(v).toFixed(1)}%</span>`;
  }

    else{ const b=getMonthlyBuckets(2); prev=b[0]; cur=b[1]; curLbl=t('thisMonth'); prevLbl=t('lastMonth'); }
    const tplE = t('compareTemplate').replace('{cur}',curLbl).replace('{type}',t('expenseWord')).replace('{prev}',prevLbl);
    const tplI = t('compareTemplate').replace('{cur}',curLbl).replace('{type}',t('incomeWord')).replace('{prev}',prevLbl);
    $('compareRow').innerHTML = `
      <div class="compare-item expense"><div class="lbl">${tplE}</div><div class="amt">${fmtCur(cur.expense, settings.currency)}</div>${deltaHtml(cur.expense, prev.expense, 'down')}</div>
      <div class="compare-item income"><div class="lbl">${tplI}</div><div class="amt">${fmtCur(cur.income, settings.currency)}</div>${deltaHtml(cur.income, prev.income, 'up')}</div>
    `;
  }

  function renderTrendChart(){
    let buckets;
    if(currentDim==='day'){
      buckets = getDailyBucketsForMonth(statsDayYear, statsDayMonth);
      $('trendTitle').textContent = t('trendDayTitle');
    }else{
      buckets = getMonthlyBucketsForYear(statsMonthYear);
      $('trendTitle').textContent = t('trendMonthTitle');
    }
    syncStatsYmSelects();
    const maxVal = Math.max(1, ...buckets.map(b=>Math.max(b.income,b.expense)));
    const top=14, base=150, chartH=190, barW=13, barGap=3, groupPad=13;
    const groupW = barW*2+barGap+groupPad;
    const totalW = Math.max(300, buckets.length*groupW+20);
    const svgEl = $('trendChart');
    svgEl.setAttribute('viewBox', `0 0 ${totalW} ${chartH}`);
    svgEl.setAttribute('width', totalW);
    svgEl.style.width = totalW+'px';

    let svg = `<line x1="8" y1="${base}" x2="${totalW-8}" y2="${base}" stroke="var(--grid)" stroke-width="1"/>`;
    const expTotals={}, incTotals={};
    buckets.forEach((b,i)=>{
      const x0 = 10 + i*groupW;
      let y = base;
      Object.entries(b.catExpense).sort((a,c)=>c[1]-a[1]).forEach(([k,v])=>{
        expTotals[k]=(expTotals[k]||0)+v;
        const h = (v/maxVal)*(base-top);
        svg += `<rect x="${x0}" y="${(y-h).toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" fill="${colorForKey(k,0)}"/>`;
        y -= h;
      });
      let y2 = base;
      Object.entries(b.catIncome).sort((a,c)=>c[1]-a[1]).forEach(([k,v])=>{
        incTotals[k]=(incTotals[k]||0)+v;
        const h = (v/maxVal)*(base-top);
        svg += `<rect x="${x0+barW+barGap}" y="${(y2-h).toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" fill="${colorForKey(k,1)}"/>`;
        y2 -= h;
      });
      svg += `<text x="${x0+barW+barGap/2}" y="${base+16}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${b.label}</text>`;
    });
    svgEl.innerHTML = svg;

    const merged = {...expTotals};
    Object.entries(incTotals).forEach(([k,v])=> merged[k]=(merged[k]||0)+v);
    const legendKeys = Object.entries(merged).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k])=>k);
    $('trendCatLegend').innerHTML = legendKeys.map((k,i)=>
      `<span class="item"><span class="legend-dot" style="background:${colorForKey(k,i)}"></span>${labelForKey(k)}</span>`
    ).join('');
  }

  function populateStatsYmSelects(){
    const nowY = new Date().getFullYear();
    const minY = nowY - 8;
    let yearsHtml = '';
    for(let y=nowY; y>=minY; y--) yearsHtml += `<option value="${y}">${y}年</option>`;
    $('trendYearSelect').innerHTML = yearsHtml;
    let monthsHtml = '';
    for(let m=1; m<=12; m++) monthsHtml += `<option value="${m}">${m}月</option>`;
    $('trendMonthSelect').innerHTML = monthsHtml;
  }
  populateStatsYmSelects();

  function syncStatsYmSelects(){
    if(currentDim==='day'){
      $('trendYearSelect').value = String(statsDayYear);
      $('trendMonthSelect').value = String(statsDayMonth);
      $('trendMonthSelect').style.display = '';
    }else{
      $('trendYearSelect').value = String(statsMonthYear);
      $('trendMonthSelect').style.display = 'none';
    }
  }
  $('trendYearSelect').addEventListener('change', ()=>{
    const v = parseInt($('trendYearSelect').value, 10);
    if(currentDim==='day') statsDayYear = v; else statsMonthYear = v;
    renderTrendChart();
  });
  $('trendMonthSelect').addEventListener('change', ()=>{
    statsDayMonth = parseInt($('trendMonthSelect').value, 10);
    renderTrendChart();
  });

  function renderStats(){ renderCompare(); renderTrendChart(); }

  // ---------- Rate page ----------
  function renderRatePage(){
    $('rateBaseLabel').textContent = rateDirection==='CNY_JPY' ? '1 CNY' : '1 JPY';
    $('rateValue').textContent = rateLoading ? t('loadingRate') : (rateData ? displayRate(rateData.rate).toFixed(4)+' '+rateUnitLabel() : t('neverFetched'));
    $('rateUpdateTime').textContent = rateData ? rateData.date : '--';
    $('refreshRateBtn').innerHTML = rateLoading
      ? `<span class="spin-icon">${iconSvg('refresh')}</span> ${t('loadingRate')}`
      : `<span>${iconSvg('refresh')}</span> ${t('refreshRate')}`;
    $('refreshRateBtn').disabled = rateLoading;
    $('refreshRateBtn').classList.toggle('is-loading', rateLoading);
    $('rateErrorText').textContent = (!rateLoading && lastRateError) ? (t('rateError')+' — '+lastRateError) : '';
    $('rateErrorText').style.display = (!rateLoading && lastRateError) ? 'block' : 'none';
    updateConverterLabels();
    renderRateTrendChart();
  }
  function updateConverterLabels(){
    if(rateDirection==='CNY_JPY'){
      $('converterFromLabel').textContent = t('converterCNYLabel');
      $('converterToLabel').textContent = t('converterJPYLabel');
      $('fromInput').placeholder = '0.00';
      $('toInput').placeholder = '0';
    }else{
      $('converterFromLabel').textContent = t('converterJPYLabel');
      $('converterToLabel').textContent = t('converterCNYLabel');
      $('fromInput').placeholder = '0';
      $('toInput').placeholder = '0.00';
    }
  }
  $('rateDirSegment').querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $('rateDirSegment').querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      rateDirection = btn.getAttribute('data-dir');
      $('rateSubLabel').textContent = rateDirection==='CNY_JPY' ? t('rateSub') : t('rateSubReverse');
      $('fromInput').value=''; $('toInput').value='';
      renderRatePage();
    });
  });
  $('rateGranSegment').querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $('rateGranSegment').querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      rateGranularity = btn.getAttribute('data-gran');
      renderRateTrendChart();
    });
  });
  $('refreshRateBtn').addEventListener('click', ()=> fetchRate(true));
  $('fromInput').addEventListener('input', ()=>{
    const v=parseFloat($('fromInput').value);
    if(isNaN(v) || !rateData) return;
    if(rateDirection==='CNY_JPY') $('toInput').value = (v*rateData.rate).toFixed(0);
    else $('toInput').value = (v/rateData.rate).toFixed(2);
  });
  $('toInput').addEventListener('input', ()=>{
    const v=parseFloat($('toInput').value);
    if(isNaN(v) || !rateData) return;
    if(rateDirection==='CNY_JPY') $('fromInput').value = (v/rateData.rate).toFixed(2);
    else $('fromInput').value = (v*rateData.rate).toFixed(0);
  });

  // 固定每月收入规则:每个月自动补一笔工资收入(不会重复生成,也不会补历史月份)
  const RECURRING_RULES = [
    { id:'rule_salary_default', type:'income', amount:289346, currency:'JPY', catKey:'salary', subKey:'salary_base', dayOfMonth:25, paymentMethod:'transfer' }
  ];
  async function ensureRecurringEntries(){
    const mk = currentMonthKey();
    let changed = false;
    RECURRING_RULES.forEach(rule=>{
      const exists = entries.some(e=> e.recurringId===rule.id && e.date.startsWith(mk));
      if(!exists){
        const catObj = allCatMap[rule.catKey];
        const subObj = findSub(catObj, rule.subKey);
        entries.push({
          id: 'recur_'+rule.id+'_'+mk,
          type: rule.type, amount: rule.amount, currency: rule.currency,
          category: catLabel(catObj), catKey: rule.catKey,
          subCategory: subObj? subLabel(subObj) : '', subKey: rule.subKey,
          paymentMethod: rule.paymentMethod || 'cash',
          icon: catObj.icon, note:'', date: mk+'-'+pad2(rule.dayOfMonth),
          createdAt: Date.now(), recurringId: rule.id
        });
        changed = true;
      }
    });
    if(changed) await saveEntries();
  }

  async function init(){
    const step = async (name, fn) => {
      try{ await fn(); }
      catch(e){ console.error('初始化步骤失败: '+name, e); }
    };
    await step('loadSettings', loadSettings);
    await step('initCustomSubs', initCustomSubs);
    await step('applyStaticI18n', applyStaticI18n);
    await step('setMonthLabel', setMonthLabel);
    await step('loadRateCache', loadRateCache);
    await step('loadEntries', loadEntries);
    await step('ensureRecurringEntries', ensureRecurringEntries);
    await step('renderAll', renderAll);
    await step('renderRatePage', renderRatePage);
    fetchRate(false).catch(e=> console.error('汇率初始拉取失败', e));
  }
  init();
})();
</script>

</body>
</html>
