name: Washi Ledger CI

on:
  push:
    paths:
      - 'washi-ledger/**'
  pull_request:
    paths:
      - 'washi-ledger/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: washi-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: washi-ledger/package-lock.json
      - run: cp .env.example .env
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run build
