name: 闹钟排程续期

# 定时调用 Supabase 的 refresh-alarm-schedules Edge Function。
# 不用 Supabase 自己的 Cron Trigger——那条路径底层是不是也走 pg_net、
# 在这个项目的实例上会不会像之前抓节假日API那次一样卡死，没有把握去验证；
# 改用 GitHub Actions 定时调用，完全不经过 Postgres，且跟仓库里
# ios-release.yml / ios-test-build.yml 是同一套熟悉的模式。
#
# 需要在仓库 Settings -> Secrets and variables -> Actions 里配置：
#   SUPABASE_FUNCTION_URL   形如 https://<项目ref>.supabase.co/functions/v1/refresh-alarm-schedules
#   REFRESH_TRIGGER_SECRET  要跟 Edge Function 那边 `supabase secrets set REFRESH_TRIGGER_SECRET=...` 是同一个值
#
# 详见 supabase/functions/refresh-alarm-schedules/README.md

on:
  schedule:
    # 每天 UTC 01:00（北京时间/日本时间早上9点/10点）跑一次，具体时间细调阶段可以再调
    - cron: "0 1 * * *"
  workflow_dispatch: {} # 也支持手动触发，方便部署完先手动跑一次验证

jobs:
  trigger-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 调用 Edge Function
        run: |
          set -e
          if [ -z "${SUPABASE_FUNCTION_URL:-}" ] || [ -z "${REFRESH_TRIGGER_SECRET:-}" ]; then
            echo "缺少 SUPABASE_FUNCTION_URL 或 REFRESH_TRIGGER_SECRET 这两个repo secret，先去仓库设置里配置"
            exit 1
          fi
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${REFRESH_TRIGGER_SECRET}" \
            -H "Content-Type: application/json" \
            "${SUPABASE_FUNCTION_URL}")
          echo "HTTP status: ${http_code}"
          cat response.json
          if [ "$http_code" -ge 300 ]; then
            echo "调用失败"
            exit 1
          fi
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          REFRESH_TRIGGER_SECRET: ${{ secrets.REFRESH_TRIGGER_SECRET }}
