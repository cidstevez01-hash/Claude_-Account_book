name: iOS 测试包(未签名 .ipa)

# 手动触发：去仓库的 Actions 标签页选这个workflow,点 "Run workflow"。
# 不跟着每次push自动跑,iOS编译在macOS runner上跑得慢、还按10倍分钟数扣费,
# 只有真的要出一个新安装包测试的时候才手动点一下。
on:
  workflow_dispatch: {}

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 算版本号(VERSION文件的语义版本号 + Actions运行号当build号,每次编译必定不一样、方便区分装的是哪一次)
        run: |
          echo "APP_VERSION=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: 安装依赖 + 生成www/(把index.html原样拷进去,顺带把版本号占位符换成真实版本号)
        run: |
          npm install
          npm run build
          sed -i '' "s/__NATIVE_APP_VERSION__/${APP_VERSION} (${APP_BUILD_NUMBER})/g" www/index.html

      - name: 生成iOS原生工程(ios/不提交进仓库,每次CI都是全新生成)
        run: npx cap add ios

      - name: 生成真实App图标(resources/icon.png -> AppIcon.appiconset,不然用的是Capacitor默认占位图标)
        run: npx capacitor-assets generate --ios

      - name: 锁定竖屏+写版本号+声明后台音频模式(Info.plist每次CI全新生成,不能直接改仓库里不存在的
          文件,只能在这一步patch;后台音频模式是闹钟功能持续响铃的前提——App进后台后靠不间断播放
          音频来防止被系统挂起)
        run: |
          set -e
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${APP_BUILD_NUMBER}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"

      - name: 同步网页内容+配置到原生工程
        run: npx cap sync ios

      - name: pod install
        working-directory: ios/App
        run: pod install --repo-update

      - name: 编译(不签名,签名这一步交给Sideloadly/AltStore用你自己的Apple ID在装机时现场做)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            build

      - name: 打包成.ipa(未签名)
        run: |
          set -e
          PRODUCTS_DIR="ios/build/Build/Products/Release-iphoneos"
          cd "$PRODUCTS_DIR"
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r "$GITHUB_WORKSPACE/pigbang-unsigned-v${APP_VERSION}-${APP_BUILD_NUMBER}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: pigbang-unsigned-ipa-v${{ env.APP_VERSION }}-${{ env.APP_BUILD_NUMBER }}
          path: pigbang-unsigned-v${{ env.APP_VERSION }}-${{ env.APP_BUILD_NUMBER }}.ipa
          retention-days: 14
