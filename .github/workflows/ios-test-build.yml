name: iOS 测试包(未签名 .ipa)

# 手动触发：去仓库的 Actions 标签页选这个workflow,点 "Run workflow"。
# 不跟着每次push自动跑,iOS编译在macOS runner上跑得慢、还按10倍分钟数扣费,
# 只有真的要出一个新安装包测试的时候才手动点一下。
on:
  workflow_dispatch: {}

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖 + 生成www/(把index.html原样拷进去,没有额外构建步骤)
        run: |
          npm install
          npm run build

      - name: 生成iOS原生工程(ios/不提交进仓库,每次CI都是全新生成)
        run: npx cap add ios

      - name: 生成真实App图标(resources/icon.png -> AppIcon.appiconset,不然用的是Capacitor默认占位图标)
        run: npx capacitor-assets generate --ios

      - name: 同步网页内容+配置到原生工程
        run: npx cap sync ios

      - name: pod install
        working-directory: ios/App
        run: pod install --repo-update

      - name: 编译(不签名,签名这一步交给Sideloadly/AltStore用你自己的Apple ID在装机时现场做)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            build

      - name: 打包成.ipa(未签名)
        run: |
          set -e
          PRODUCTS_DIR="ios/build/Build/Products/Release-iphoneos"
          cd "$PRODUCTS_DIR"
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r "$GITHUB_WORKSPACE/jiazhangbu-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: jiazhangbu-unsigned-ipa
          path: jiazhangbu-unsigned.ipa
          retention-days: 14
