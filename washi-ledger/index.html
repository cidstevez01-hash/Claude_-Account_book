<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale=1锁死缩放——照旧仓库根目录index.html同款viewport配置(那边同样是
         Capacitor原生壳，这个限制已经验证过不影响正常使用)。之前这里少了maximum-scale，
         真机上登录页input获得焦点时WKWebView会自动放大到能看清文字的比例，且SPA路由切换
         不会重新加载页面，缩放状态会一直带到其他页面，导致整个App变成"可以到处拖动/
         图变形"的样子。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Washi Ledger</title>
  </head>
  <body>
    <!-- 底部导航气泡液态玻璃特效(#4)用的SVG折射滤镜——照旧仓库根目录index.html原样搬，
         噪声位移让气泡背后被盖住的图标透过玻璃看起来轻微扭曲变形，CSS里
         backdrop-filter: ... url(#glassLens)引用的就是这个滤镜定义，必须挂在文档里 -->
    <svg width="0" height="0" style="position: absolute; overflow: hidden">
      <defs>
        <filter id="glassLens" x="-40%" y="-40%" width="180%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.009 0.05" numOctaves="2" seed="9" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="2" result="softNoise" />
          <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="38" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
